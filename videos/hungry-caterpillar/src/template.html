        const st = opts.style ? ` style="${opts.style}"` : "";
        const bg = opts.bg ? ` style="background:${opts.bg}"` : "";
        const tc = opts.color ? ` style="color:${opts.color}"` : "";
        return `<div id="${id}" class="card ${cls}"${st}><div class="bg"${bg}></div><div class="txt"${tc}>${text}</div></div>`;
      }
      const dots = (id) => `<div id="${id}" class="dots"><span><i></i></span><span><i></i></span><span><i></i></span></div>`;
      // centred stack inside a horizontal band
      const row = (left, right, top, inner) => `<div class="row" style="left:${left}px; right:${right}px; top:${top}px">${inner}</div>`;

      // ================= timeline helpers =================
      const tl = gsap.timeline({ paused: true });

      function crawl(id, start, dur, amp) {
        amp = amp || 14;
        const segs = document.querySelectorAll("." + id + "-seg");
        const cycle = 0.5;
        const reps = Math.max(0, Math.floor(dur / cycle) * 2 - 1);
        segs.forEach((seg, i) => {
          tl.to(seg, { y: -amp, duration: cycle / 2, ease: "sine.inOut", yoyo: true, repeat: reps }, start + i * 0.06);
        });
        tl.to("." + id + "-head", { y: -amp * 0.6, duration: cycle / 2, ease: "sine.inOut", yoyo: true, repeat: reps }, start + segs.length * 0.06);
      }
      function blink(id, t) {
        tl.to("." + id + "-eyes", { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.08, yoyo: true, repeat: 1 }, t);
      }
      function mouth(id, which, t) {
        for (const m of ["smile", "open", "frown"]) tl.set("." + id + "-" + m, { opacity: m === which ? 1 : 0 }, t);
      }
      function popIn(sel, t, from) {
        tl.fromTo(sel, { scale: from || 0.3, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.2)", immediateRender: false }, t);
        tl.set(sel, { opacity: 0 }, 0);
      }
      function popOut(sel, t) {
        tl.to(sel, { scale: 0.6, opacity: 0, duration: 0.3, ease: "power2.in" }, t);
      }
      function pageIn(sel, t) {
        tl.fromTo(sel, { xPercent: 100 }, { xPercent: 0, duration: 0.6, ease: "power3.inOut" }, t);
      }
      function waitDots(sel, t, dur) {
        popIn(sel, t, 0.6);
        document.querySelectorAll(sel + " i").forEach((dot, i) => {
          tl.fromTo(dot, { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, t + 0.2 + (i * (dur - 0.4)) / 3);
        });
        popOut(sel, t + dur);
      }
      function munch(cat, biteSel, t) {
        document.querySelectorAll(biteSel).forEach((b, i) => {
          mouth(cat, "open", t + i * 0.5);
          tl.to("#" + cat + " ." + cat + "-head", { x: 14, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, t + i * 0.5);
          tl.to(b, { attr: { r: 34 }, duration: 0.18, ease: "back.out(2)" }, t + i * 0.5 + 0.12);
          mouth(cat, "smile", t + i * 0.5 + 0.3);
        });
      }
      function bounceItem(sel, t, h) {
        tl.to(sel, { y: -(h || 40), duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, t);
      }
      function dropIn(sel, t) {
        tl.fromTo(sel, { y: -900 }, { y: 0, duration: 0.9, ease: "bounce.out" }, t);
      }
      function blinkEvery(id, from, to, every) {
        for (let t = from + 1.3; t < to - 0.3; t += every) blink(id, t);
      }
      function flap(sel, t, dur, period, deep) {
        const reps = Math.max(0, Math.floor(dur / period) * 2 - 1);
        tl.to(sel + "-wl", { scaleX: deep || 0.35, transformOrigin: "100% 50%", duration: period / 2, ease: "sine.inOut", yoyo: true, repeat: reps }, t);
        tl.to(sel + "-wr", { scaleX: deep || 0.35, transformOrigin: "0% 50%", duration: period / 2, ease: "sine.inOut", yoyo: true, repeat: reps }, t);
      }

      const GROUND = 860;
      const COUNT_LAYOUT = {

        2: { sc: 1.2, xs: [1060, 1420] },
        3: { sc: 1.1, xs: [1000, 1300, 1600] },
        4: { sc: 0.95, xs: [980, 1225, 1470, 1715] },
        5: { sc: 0.82, xs: [960, 1150, 1340, 1530, 1720] },

      const BUILD = {

          let badges = "";
          L.xs.forEach((x, i) => {

          page.innerHTML =

            row(820, 100, 100, card(id + "-q", "bubble", "?") + dots(id + "-dots")) +
            row(820, 100, 110, card(id + "-word", "word", cfg.word, { color: WORD_COLORS[cfg.item] })) +
            badges +
            card(id + "-say", "say", "hungry!", { style: `left:${headX - 170}px; top:420px` });

          pageIn("#" + id + "-page", sc.start);
          popIn("#" + id + "-day", sc.start + 0.5);
          crawl(cat, sc.start + 0.3, 1.8);
          tl.fromTo("#" + id + "-cat", { x: -320 }, { x: 0, duration: 1.8, ease: "power1.out" }, sc.start + 0.3);
          L.xs.forEach((x, i) => dropIn("#" + id + "-i" + i + "-in", p("drop") + i * 0.25));
          // question + thinking pause
          popIn("#" + id + "-q", p("q") - 0.1);
          tl.to("#" + id + "-q .txt", { rotation: 10, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, p("q") + 0.4);
          waitDots("#" + id + "-dots", p("dots"), 2.1);
          popOut("#" + id + "-q", p("word") - 0.35);
          // answer
          popIn("#" + id + "-word", p("word"));
          L.xs.forEach((x, i) => tl.to("#" + id + "-i" + i + "-in", { scale: 1.08, transformOrigin: "50% 100%", duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, p("word") + i * 0.08));
          tl.to("#" + id + "-word .txt", { scale: 1.18, duration: 0.22, yoyo: true, repeat: 1, ease: "power2.out" }, p("w"));
          // counting
          L.xs.forEach((x, i) => {
            popIn("#" + id + "-b" + i, p("c" + i));
            bounceItem("#" + id + "-i" + i + "-in", p("c" + i));
          });
          for (let i = 0; i < n; i++) tl.to("#" + id + "-b" + i + " .bg", { scale: 1.12, duration: 0.2, yoyo: true, repeat: 1 }, p("n") + i * 0.06);
          // munch
          const cr = p("crawl");
          popOut("#" + id + "-word", cr - 0.2);
          for (let i = 0; i < n; i++) popOut("#" + id + "-b" + i, cr - 0.2);
          crawl(cat, cr, 0.9);
          tl.to("#" + id + "-cat", { x: catX, duration: 0.9, ease: "power1.inOut" }, cr);
          munch(cat, "." + id + "-i0-bite", p("munch"));
          for (let i = 1; i < n; i++) tl.to("." + id + "-i" + i + "-bite", { attr: { r: 26 }, duration: 0.2, ease: "back.out(2)" }, p("munch") + 1.4 + (i - 1) * 0.05);
          L.xs.forEach((x, i) => tl.to("#" + id + "-i" + i + "-in", { scale: 0, opacity: 0, transformOrigin: "50% 100%", duration: 0.4, ease: "back.in(2)" }, p("h") - 0.45 + i * 0.08));
          // still hungry
          mouth(cat, "frown", p("h"));
          popIn("#" + id + "-say", p("h") + 0.1);
          tl.to("#" + id + "-cat", { x: catX + 14, duration: 0.07, yoyo: true, repeat: 7, ease: "none" }, p("h") + 0.3);
          blinkEvery(cat, sc.start, sc.end, 2.6);
        },

        sat(sc, page) {

            '<g id="fly-night">' + sky("#22386e") +

          tl.fromTo("#fly-cocoon", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 1.2, ease: "back.out(1.4)", immediateRender: false }, p("house") + 0.5);
          tl.set("#fly-cocoon", { scaleY: 0, transformOrigin: "50% 0%" }, 0);
          tl.to("#fly-cat", { y: -420, scale: 0.25, opacity: 0, transformOrigin: "50% 50%", duration: 0.9, ease: "power2.in" }, p("house") + 0.6);
          // sleep
          tl.fromTo("#fly-night", { opacity: 0 }, { opacity: 0.92, duration: 1.0, immediateRender: false }, p("night"));
          tl.set("#fly-night", { opacity: 0 }, 0);
          tl.to("#fly-cocoon", { rotation: 4, transformOrigin: "50% 0%", duration: 1.0, yoyo: true, repeat: 3, ease: "sine.inOut" }, p("night"));
          document.querySelectorAll("#fly-zzz .z").forEach((z, i) => {
            tl.fromTo(z, { opacity: 0, y: 30 }, { opacity: 1, y: -40, duration: 1.2, ease: "sine.out", repeat: 1, repeatDelay: 0.4, immediateRender: false }, p("zzz") - 0.8 + i * 0.4);
            tl.set(z, { opacity: 0 }, 0);
            tl.to(z, { opacity: 0, duration: 0.3 }, p("day"));
          });
          tl.to("#fly-night", { opacity: 0, duration: 1.0 }, p("day"));
          // push, push, pop
          tl.to("#fly-cocoon", { rotation: 8, transformOrigin: "50% 0%", duration: 0.14, yoyo: true, repeat: 7, ease: "sine.inOut" }, p("push"));
          tl.to("#fly-cocoon", { scaleX: 1.3, opacity: 0, duration: 0.3, ease: "power2.out" }, p("hatch"));
          tl.fromTo("#fly-bfly-sc", { scale: 0.15, opacity: 0 }, { scale: 0.45, opacity: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, p("hatch"));
          tl.set("#fly-bfly-sc", { opacity: 0 }, 0);
          tl.set(".bf-wl", { scaleX: 0.15, transformOrigin: "100% 50%" }, 0); tl.set(".bf-wr", { scaleX: 0.15, transformOrigin: "0% 50%" }, 0);
          tl.to(".bf-wl", { scaleX: 1, transformOrigin: "100% 50%", duration: 1.0, ease: "elastic.out(1, 0.6)" }, p("wow"));
          tl.to(".bf-wr", { scaleX: 1, transformOrigin: "0% 50%", duration: 1.0, ease: "elastic.out(1, 0.6)" }, p("wow"));
          tl.to("#fly-bfly-sc", { scale: 1.0, duration: 1.2, ease: "power2.out" }, p("wow") + 0.2);
          tl.to("#fly-bfly-pos", { y: 120, duration: 1.2, ease: "power2.out" }, p("wow") + 0.2);
          popIn("#fly-word", p("word"));
          popOut("#fly-word", p("flyaway") + 0.4);
          const f = p("flyaway");
          flap(".bf", f, sc.end - f, 0.32, 0.3);
          tl.to("#fly-bfly-sc", { scale: 0.6, duration: 0.8, ease: "sine.inOut" }, f);
          tl.to("#fly-bfly-pos", { keyframes: [{ x: -500, y: -40 }, { x: -200, y: -200 }, { x: 400, y: -120 }, { x: 650, y: 60 }, { x: 300, y: 80 }], duration: sc.end - f, ease: "sine.inOut" }, f);
        },

        play(sc, page) {
          const p = (k) => mk("play." + k);
          const kinds = ["apple", "pear", "plum", "strawberry", "orange"];
          let cards = "";
          kinds.forEach((k) => {
            const it = ITEMS[k], s = 1.6;
            const cy = 330 + ((it.bottom + it.top) / 2) * -s;
            cards += `<div id="play-${k}" class="flash"><div class="bg"></div><svg viewBox="0 0 700 700"><g transform="translate(350 ${cy}) scale(${s})">${item("pl-" + k, k)}</g></svg><div class="fw" style="color:${WORD_COLORS[k]}">${k}</div></div>`;
          });
          page.innerHTML =
            '<svg class="layer" viewBox="0 0 1920 1080">' + grain + sky("#cfe9f7") + cloud(120, 200, 1) + cloud(1500, 140, 0.9) + cloud(1600, 620, 0.7) +
            '<g transform="translate(250 760) scale(0.55)"><g id="play-bf">' + butterfly("pbf") + "</g></g></svg>" +
            '<div id="play-title" class="big-title" style="top:360px"><span class="tw" style="color:#d8302a">Let\'s</span><span class="tw" style="color:#2f8f3f">play!</span></div>' +
            cards + row(1360, 60, 300, card("play-q", "bubble", "?") + dots("play-dots"));
          pageIn("#play-page", sc.start);
          flap(".pbf", sc.start, sc.end - sc.start, 0.5, 0.45);
          tl.to("#play-bf", { y: -40, duration: 1.2, yoyo: true, repeat: Math.floor((sc.end - sc.start) / 1.2) - 1, ease: "sine.inOut" }, sc.start);
          document.querySelectorAll("#play-title .tw").forEach((w, i) => {
            tl.fromTo(w, { y: 80, scale: 0.4, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)", immediateRender: false }, p("title") + i * 0.25);
            tl.set(w, { opacity: 0 }, 0);
          });
          tl.to("#play-title", { opacity: 0, y: -60, duration: 0.4 }, p("card_apple") - 0.3);
          kinds.forEach((k, i) => {
            const t = p("card_" + k);
            tl.fromTo("#play-" + k, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, t);
            tl.set("#play-" + k, { opacity: 0 }, 0);
            popIn("#play-q", p("q_" + k) - 0.1);
            waitDots("#play-dots", p("dots_" + k), 1.8);
            popOut("#play-q", p("ans_" + k) - 0.2);
            tl.fromTo("#play-" + k + " .fw", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, p("ans_" + k));
            tl.set("#play-" + k + " .fw", { opacity: 0 }, 0);
            const out = i < 4 ? p("card_" + kinds[i + 1]) - 0.05 : sc.end - 0.7;
            tl.to("#play-" + k, { x: -900, rotation: -12, opacity: 0, duration: 0.45, ease: "power2.in" }, out - 0.4);
          });
        },

        count(sc, page) {
          const p = (k) => mk("count." + k);
          const xs = [660, 900, 1140, 1380];
          let items = "", badges = "";
          xs.forEach((x, i) => {
            items += placed("cn-" + i, "strawberry", x, 1.0, GROUND, []);
            badges += card("cn-b" + i, "badge", String(i + 1), { style: `left:${x - 70}px; top:${GROUND - 235 - 160}px` });
          });
          page.innerHTML =
            '<svg class="layer" viewBox="0 0 1920 1080">' + grain + ground(GROUND) + items + "</svg>" + badges +
            row(560, 560, 110, card("cn-q", "bubble", "?") + dots("cn-dots")) +
            row(560, 560, 130, card("cn-total", "word", "4 strawberries", { color: "#d8302a" }));
          pageIn("#count-page", sc.start);
          xs.forEach((x, i) => popIn("#cn-" + i + "-in", p("drop") + 0.2 + i * 0.2));
          popIn("#cn-q", p("q") - 0.1);
          waitDots("#cn-dots", p("dots"), 1.8);
          popOut("#cn-q", p("lets") - 0.2);
          xs.forEach((x, i) => {
            popIn("#cn-b" + i, p("c" + i));
            bounceItem("#cn-" + i + "-in", p("c" + i), 50);
          });
          popIn("#cn-total", p("total"));
          for (let i = 0; i < 4; i++) tl.to("#cn-b" + i + " .bg", { scale: 1.12, duration: 0.2, yoyo: true, repeat: 1 }, p("total") + i * 0.06);
        },

        point(sc, page) {
          const p = (k) => mk("point." + k);
          const slots = [["orange", 420], ["apple", 800], ["plum", 1160], ["bfly", 1530]];
          let items = "";
          slots.forEach(([k, x]) => {
            if (k === "bfly") items += `<g transform="translate(${x} 640) scale(0.6)"><g id="pt-bfly-in">${butterfly("pbf2")}</g></g>`;
            else items += placed("pt-" + k, k, x, 1.15, GROUND, []);
          });
          const ring = (id, x, y, r) => `<circle id="${id}" cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#f7c21f" stroke-width="16" stroke-dasharray="30 18" />`;
          page.innerHTML =
            '<svg class="layer" viewBox="0 0 1920 1080">' + grain + sky("#eaf6e1") + ground(GROUND) +
            ring("pt-ring1", 800, GROUND - 130, 190) + ring("pt-ring2", 1530, 640, 190) + items + "</svg>" +
            row(560, 560, 110, card("pt-q", "bubble", "?") + dots("pt-dots1")) +
            row(560, 560, 110, card("pt-q2", "bubble", "?") + dots("pt-dots2")) +
            row(0, 0, 120, card("pt-w1", "word", "apple", { color: "#d8302a" })) +
            row(0, 0, 120, card("pt-w2", "word", "butterfly", { color: "#7a4fb0" }));
          pageIn("#point-page", sc.start);
          flap(".pbf2", sc.start, sc.end - sc.start, 0.6, 0.5);
          slots.forEach(([k], i) => popIn(k === "bfly" ? "#pt-bfly-in" : "#pt-" + k + "-in", sc.start + 0.5 + i * 0.15));
          popIn("#pt-q", p("q1") - 0.1);
          waitDots("#pt-dots1", p("dots1"), 2.5);
          popOut("#pt-q", p("here1") - 0.2);
          popIn("#pt-ring1", p("here1"));
          tl.to("#pt-ring1", { rotation: 90, transformOrigin: "50% 50%", duration: p("reset") - p("here1"), ease: "none" }, p("here1"));
          bounceItem("#pt-apple-in", p("here1") + 0.1, 60);
          bounceItem("#pt-apple-in", p("here1") + 0.6, 40);
          tl.to("#pt-orange-in, #pt-plum-in, #pt-bfly-in", { opacity: 0.3, duration: 0.3 }, p("here1"));
          popIn("#pt-w1", p("here1") + 0.2);
          popOut("#pt-w1", p("reset"));
          popOut("#pt-ring1", p("reset"));
          tl.to("#pt-orange-in, #pt-plum-in, #pt-bfly-in", { opacity: 1, duration: 0.3 }, p("reset"));
          popIn("#pt-q2", p("q2") - 0.1);
          waitDots("#pt-dots2", p("dots2"), 2.5);
          popOut("#pt-q2", p("here2") - 0.2);
          popIn("#pt-ring2", p("here2"));
          tl.to("#pt-ring2", { rotation: 90, transformOrigin: "50% 50%", duration: sc.end - p("here2"), ease: "none" }, p("here2"));
          bounceItem("#pt-bfly-in", p("here2") + 0.1, 60);
          tl.to("#pt-orange-in, #pt-apple-in, #pt-plum-in", { opacity: 0.3, duration: 0.3 }, p("here2"));
          popIn("#pt-w2", p("here2") + 0.2);
        },

        bye(sc, page) {
          const p = (k) => mk("bye." + k);
          page.innerHTML =
            '<svg class="layer" viewBox="0 0 1920 1080">' + grain + sky("#cfe9f7") + cloud(160, 220, 1) + cloud(1450, 160, 1) + ground(GROUND) +
            sun("bye-sun", 1700, 180, 0.7) +
            `<g transform="translate(120 790) scale(0.8)"><g id="bye-cat">${caterpillar("cbye")}</g></g>` +
            '<g transform="translate(1180 520)"><g id="bye-bf-pos"><g transform="scale(0.8)">' + butterfly("bbf") + "</g></g></g></svg>" +
            '<div id="bye-title" class="big-title" style="top:150px"><span class="tw" style="color:#7a4fb0">Bye-bye!</span></div>' +
            '<div id="bye-end" class="big-title" style="top:150px"><span class="tw" style="color:#2f8f3f">The End</span></div>';
          pageIn("#bye-page", sc.start);
          flap(".bbf", sc.start, sc.end - sc.start, 0.36, 0.3);
          tl.to(".bye-sun-rays", { rotation: 30, transformOrigin: "50% 50%", duration: sc.end - sc.start, ease: "none" }, sc.start);
          popIn("#bye-title", p("bye") + 0.2);
          tl.to(".cbye-head", { rotation: -10, transformOrigin: "50% 90%", duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, p("bye"));
          blinkEvery("cbye", sc.start, sc.end, 2);
          tl.to("#bye-bf-pos", { keyframes: [{ x: 120, y: -60 }, { x: 260, y: -120 }, { x: 900, y: -700 }], duration: p("end") - sc.start + 0.4, ease: "sine.in" }, sc.start + 0.3);
          popOut("#bye-title", p("end") - 0.3);
          popIn("#bye-end", p("end"));
        },
      };
      const WORD_COLORS = { apple: "#d8302a", pear: "#4f9a2a", plum: "#6b3a9e", strawberry: "#d8303a", orange: "#d4700f", leaf: "#2f8f3f" };

      DATA.scenes.forEach((sc, i) => {
        const page = document.getElementById(sc.id + "-page");
        BUILD[sc.kind](sc, page);
        if (i > 0 && sc.kind !== "day" && !["sat", "sun", "fly", "play", "count", "point", "bye"].includes(sc.kind)) pageIn("#" + sc.id + "-page", sc.start);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
