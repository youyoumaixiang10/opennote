<!doctype html>
<meta charset="utf-8">
<title>film</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(92vw,720px);height:auto;background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1080" height="1080"></canvas>
<script src="core.js"></script>
<script src="studio.js"></script>
<script src="materials.js"></script>
<script>
'use strict';
// ============================================================
// FILM TEMPLATE. Copy next to core.js and edit the four sections below.
// core.js gives you: palettes (PALETTES, usePalette, makePalette, derivePalette, duotone),
// finishes (surface, dotScreen, plate/printPlate), marks (wob, hatch, grain, scribble,
// construction, squiggleText, handText, crayon), organic forms (blob, curvePath, warp, smoothPts),
// motion (key, keyPath, spring, settle, anticipate, arc, squash, breathe, drift, twos, camKeys, smear),
// lattices (hexCells, hexLattice, aster, dotBurst), motifs (seedDot, ripples, dashedRing, dottedArc, plant,
// section, stickyNote, thread, signOff), composition (layer, cam, blot, iris, mosaic, montage, badges, flash),
// sheets (styleSheet, paletteSheet), and defineFilm() with the player and render hooks.
// Doodles on photos (place, on, photo, photoFront, doodle, brush, wash, nightfall): see references/doodle.md
// and examples/held-once.html, cut photos with scripts/photo.mjs and load photos.js right after core.js.
// The timing rules and every motion helper: references/motion.md.
// ============================================================

// ===================== BRIEF & BEAT SHEET =====================
// Subject: <one sentence>
// Format: <1:1 | 16:9 | 9:16>, short side 1080 logical units. fps: 24; exposure follows each action (camera sampled independently).
// Draw relative to CX, CY, W, H so any format works.
// t     dur   scene        camera            what changes                                          kit                                  sound
// 0.0   1.0   stylesheet   -                 check palette and finish                              styleSheet                           -
// 1.0   0.5   palette      -                 ramps and harmony                                     paletteSheet                         -
// 1.5   3.5   hop          keys, handheld    the bug sits, winds up, hops on an arc, lands, settles arc squash settle camKeys smear      plucks, a thud
// 5.0   2.0   blueprint    static            blot to blueprint, hold, mosaic POV                   blot iris mosaic                     swell

// ===================== PALETTE =====================
usePalette('paperInk');
// Other starts:
//   usePalette('risoPop');  usePalette('screenSea');  usePalette('pencilMinimal');  usePalette('blueprintNight');
//   usePalette(makePalette({ fills: ['#3a7ca5', '#d9a441', '#c94c4c'], finish: 'riso' }, 'risoPop'));
//   usePalette(derivePalette(PALETTES.screenSea, { hue: 40, sat: .8 }));
//   usePalette(duotone('#ff48b0', '#0078bf'));
// A scene may switch palettes at its top (usePalette(...)) when the film changes look between shots.

// ===================== PUPPET =====================
// Legacy rig demonstration: local part geometry, fills and separately varied outlines.
// For the default redrawn character approach see examples/sketchbook-bird.html and references/redrawn-animation.md.
// This introductory puppet uses a few controls; production actors may need more. One draw function with an ink/blueprint switch. Fill -> surface() -> outline; surface() follows PAL.finish.
const BUG_ARGS = { body: [0, 10, 42, 64], head: [0, -70, 28, 28] };
const BUG_PTS = { body: blob(...BUG_ARGS.body, 3, { amp: .05 }), head: blob(...BUG_ARGS.head, 4, { amp: .07 }) };
const BUG = { body: curvePath(BUG_PTS.body), head: curvePath(BUG_PTS.head), eyeL: ellPath(-14, -76, 10, 12, -.3), eyeR: ellPath(14, -76, 10, 12, .3) };
// a leg: hip, knee, ankle, foot. Extra points along each bone let wob curve the bone while the knee stays a corner.
function legPts(s, y0, ph, tuck) { const k = [s * 60, y0 - 16 + ph], f = [s * 86, y0 + 14 + ph - tuck * 8]; return [[s * 34, y0], [s * 46, y0 - 9 + ph * .5], k, [s * 72, y0 - 2 + ph], f, [s * 96, y0 + 16 + ph]]; }
// pose: walk 0..1 phase, twitch 0|1 (antennae), tuck 0..1 (legs drawn in, for the air), blink 0|1
function drawBug(c, mode, pose, seed) {
  const ink = mode !== 'blueprint', line = ink ? PAL.ink : PAL.chalk;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  for (let i = 0; i < 3; i++) for (const s of [-1, 1]) { const y0 = -20 + i * 24, ph = Math.sin(pose.walk * TAU + i * 2 + s) * 8; c.strokeStyle = line; c.lineWidth = 2.2; wob(c, legPts(s, y0, ph, pose.tuck), 1.2, seed + 10 + i * 3 + s, false, { pressure: .7 }); }
  c.lineWidth = 1.6; for (const s of [-1, 1]) wob(c, [[s * 10, -94], [s * 16, -108 - pose.twitch * 3], [s * 24, -119 - pose.twitch * 6], [s * 40, -126 - pose.twitch * 4]], 1, seed + 20 + s, false, { pressure: .8, corner: 1.4 });
  const parts = [['body', PAL.fills[1], [-44, -56, 88, 132]], ['head', PAL.fills[0], [-30, -100, 60, 60]]];
  for (const [k, col, box] of parts) { const p = BUG[k]; if (ink) { c.fillStyle = col; c.fill(p); surface(c, p, box, { seed: seed + 30 + k.length }); } c.strokeStyle = line; c.lineWidth = ink ? 2.4 : 2.6; wob(c, BUG_PTS[k], 1.8, seed + 50 + k.length, true, { pressure: .45 }); }
  if (ink) { c.save(); c.clip(BUG.body); c.strokeStyle = PAL.shade; c.lineWidth = 7; c.globalAlpha = .9; for (let i = 0; i < 4; i++) { const y = 10 + i * 18; wob(c, [[-46, y - 3], [-20, y + 4], [20, y + 4], [46, y - 3]], 1.5, seed + 40 + i, false, { pressure: .5 }); } c.restore(); }
  for (const [p, s] of [[BUG.eyeL, -1], [BUG.eyeR, 1]]) { c.save(); c.clip(p); if (ink) { c.fillStyle = PAL.blush; c.fill(p); }
    hexCells([s * 14 - 12, -90, 24, 26], 3.2, (x, y) => { const hp = hexPath(x, y, 3.2); if (ink) { const l = clamp(1 - Math.hypot(x - s * 9, y + 82) / 22, 0, 1); c.fillStyle = mix(shade(PAL.blush, .4), tint(PAL.blush, .5), l); c.fill(hp); c.strokeStyle = alpha(PAL.ink, .5); c.lineWidth = .6; } else { c.strokeStyle = PAL.chalk; c.lineWidth = .7; c.globalAlpha = .75; } c.stroke(hp); });
    c.globalAlpha = 1; c.fillStyle = '#fff'; c.beginPath(); c.arc(s * 10, -82, 2.4, 0, TAU); c.fill(); if (pose.blink && ink) { c.fillStyle = PAL.fills[0]; c.fillRect(s * 14 - 12, -90, 24, 12 + pose.blink * 14); } c.restore(); c.strokeStyle = line; c.lineWidth = 1.6; wob(c, ellPts(s * 14, -76, 10, 12, s * .3), 1.2, seed + 60 + s, true); }
  if (ink) scribble(c, BUG.body, 0, 10, { seed: seed + 70, amp: 5, alpha: .5 });
  c.restore();
}

// ===================== SCENES =====================
// Each scene is (c, tau, i): tau = seconds since the scene started (continuous in a 24 fps film), i = global frame on the 12 fps grid.
// The hop, as pure functions of time. Every number that moves comes from here, so the blueprint scene can ask for the same pose.
const bugExposure = exposureTrack([{at:0,on:2},{at:34/24,on:1},{at:54/24,on:2}]);
const HOP = { t0: 1.1, t1: 1.45, t2: 2.05, from: [-150, 40], to: [130, 40], lift: 170 };   // sit, wind up, fly, land
function bugAt(t) {                                       // t = seconds into the hop scene, already on twos
  const { t0, t1, t2, from, to, lift } = HOP, air = sm(t1, t2, t, u => u);           // linear in time across the arc: the parabola supplies the ease
  const [x, y] = t < t1 ? from : arc(from, to, air, lift);
  const sq = t < t1 ? -.22 * sm(t0, t1, t, easeOut)                                   // anticipation: it crouches
    : t < t2 ? lerp(.3, .08, easeOut(air))                                             // stretched at take-off, rounder at the top
    : settle(t, t2, { amp: -.32, freq: 2.4, decay: 5.5, phase: Math.PI / 2 });        // landing squash that rings down
  const vx = t < t1 || t >= t2 ? 0 : (to[0] - from[0]) / (t2 - t1), vy = t < t1 || t >= t2 ? 0 : -lift * 4 * (1 - 2 * air) / (t2 - t1);
  const lean = Math.atan2(vx, -vy) * .22 * (t >= t1 && t < t2 ? 1 - sm(t2 - .2, t2, t) : 0) + (t >= t2 ? settle(t, t2, { amp: .12, freq: 2.4, decay: 5 }) : 0);   // leans into the flight, straightens before it lands, wobbles upright
  return { x: CX + x, y: CY + y, sq, lean, tuck: t < t1 ? 0 : t < t2 ? sm(t1, t1 + .12, t, easeOut) * (1 - sm(t2 - .12, t2, t)) : 0, air: t >= t1 && t < t2 };
}
const CAMK = [[0, CX - 60, CY + 40, 1.08], [HOP.t1, CX - 90, CY + 30, 1.16], [HOP.t2 + .2, CX + 70, CY + 10, 1.22], [3.5, CX + 80, CY, 1.25]];   // where the camera goes, on ones
function sceneHop(c, tau, i) {
  paper(c); camKeys(c, tau, CAMK, { hand: 2.5 });
  const ground = circPath(CX, CY + 800, 800), gbox = [CX - 800, CY, 1600, 1600];
  c.fillStyle = PAL.fills[0]; c.fill(ground);
  surface(c, ground, gbox, { seed: 21, color: PAL.light, density: .25, gap: 6, len: 16, alpha: .5, width: 1.4, grain: 0 });
  surface(c, circPath(CX + 260, CY + 900, 600), [CX - 340, CY + 300, 1200, 1200], { seed: 22, color: PAL.blush, density: .45, gap: 5, len: 18, alpha: .35, grain: 6000 });
  c.strokeStyle = PAL.ink; c.lineWidth = 3; c.globalAlpha = .85; wob(c, ellPts(CX, CY + 800, 800, 800, 0, 120), 2.5, 24, true, { pressure: .3 }); c.globalAlpha = 1;
  const b = bugAt(bugExposure(tau)), pose = { walk: 0, twitch: pulse(i, 8) ? 1 : 0, tuck: b.tuck, blink: pulse(i + 5, 31, 2) ? 1 : 0 };   // the jump uses ones; the surrounding holds use twos
  const put = (cc, dt) => { const q = dt ? bugAt(bugExposure(tau) + dt) : b; cc.save(); cc.translate(q.x, q.y + 100); cc.rotate(-.12 + q.lean); cc.scale(...squash(q.sq).map(v => v * 1.6)); cc.translate(0, -62); drawBug(cc, 'ink', pose, 26); cc.restore(); };   // scaled about the feet
  if (!b.air) construction(c, b.x, b.y, 110, 25);
  if (b.air) smear(c, 2, .08, dt => put(c, dt)); else put(c, 0);
}
const L1 = layer(), L2 = layer();
function sceneBlueprint(c, tau, i) {
  sceneHop(L1.getContext('2d'), 3.5, i);                                   // the last frame of the hop, held
  const b = bugAt(3.5), g = L2.getContext('2d'); night(g, PAL.night, 31); camKeys(g, 3.5, CAMK);
  g.strokeStyle = PAL.chalk; g.lineWidth = 1.2; g.globalAlpha = .7; wob(g, ellPts(CX, CY + 800, 800, 800, 0, 120), 1.5, 24, true); g.globalAlpha = 1;
  g.save(); g.translate(b.x, b.y + 100); g.rotate(-.12); g.scale(1.6, 1.6); g.translate(0, -62); construction(g, 0, 62, 110, 25, alpha(PAL.chalk, .6)); drawBug(g, 'blueprint', { walk: 0, twitch: 0, tuck: 0, blink: 0 }, 26); g.restore();
  blit(c, L1);
  blot(c, L2, CX + 20, CY, lerp(0, 1000, sm(0, .8, tau, easeOut)), 32);
  if (tau >= 1.4) { c.fillStyle = PAL.night; c.fillRect(0, 0, W, H); iris(c, CX, CY, 505, cc => mosaic(cc, L1, lerp(40, 13, sm(1.4, 2.0, tau)))); c.strokeStyle = PAL.chalk; c.lineWidth = 3; wob(c, ellPts(CX, CY, 505, 505, 0, 120), 2, 33, true); }
}

// ===================== SCORE =====================
// Reads the same timeline as the pictures: a cue on every cut plus a motif per scene, a pluck at take-off and a thud on landing.
function score(ac, t0, dest) {
  const master = ac.createGain(); master.gain.value = .6; master.connect(dest); const r = rng(7); let acc = 0;
  for (const s of TIMELINE) { note(ac, master, pentHz(1, 0), t0, acc, .5, 'sine', .25); for (let t = acc; t < acc + s.dur; t += .5) note(ac, master, pentHz(0, r() * 5 | 0), t0, t, .6, 'triangle', .15); if (s.name === 'hop') { note(ac, master, pentHz(2, 4), t0, acc + HOP.t1, .3, 'triangle', .2); noiseBurst(ac, master, t0, acc + HOP.t2, .09, .35, 3); note(ac, master, pentHz(-1, 0), t0, acc + HOP.t2, .5, 'sine', .3); } acc += s.dur; }
}

// ===================== FILM =====================
const TIMELINE = [
  { name: 'stylesheet', dur: 1.0, fn: styleSheet, twos: true },
  { name: 'palette',    dur: 0.5, fn: paletteSheet, twos: true },
  { name: 'hop',        dur: 3.5, fn: sceneHop },                 // on ones: the camera drifts smoothly, the bug moves on twos inside it
  { name: 'blueprint',  dur: 2.0, fn: sceneBlueprint, twos: true },
];
defineFilm({ timeline: TIMELINE, score, format: { ar: '1:1' }, fps: 24 });   // render.mjs --ar 9:16 --width 1080 overrides the format
</script>
