<!doctype html>
<meta charset="utf-8">
<title>the hedgehog and the moon</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(92vw,720px);height:auto;background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1080" height="1080"></canvas>
<script src="../assets/core.js"></script>
<script src="../assets/paper3d.js"></script>
<script src="night-shift-photos.js"></script>
<script>
'use strict';
// ============================================================
// THE HEDGEHOG AND THE MOON. Method: paper in space. A pop-up book on a table. Every sheet is drawn by the core in 2D
// (brush, wash, gouache, cut-out museum photos), then stood up in a 3D room: the cover opens, leaves turn about the spine,
// pieces fold flat and rise, the camera travels, a lamp shades the sheets and drops their shadows on the page.
// Photos: The Metropolitan Museum of Art, Open Access (CC0), credits in night-shift-photos.js. Square only, 12 fps on twos.
// t      what happens
// 0.0    the shut book on the table, the camera pushes in on the cover
// 2.2    the cover opens, spread 1 rises: night sky, the moon on its stick, pines, the hedgehog looking up
// 11.5   the leaf turns: the forest folds down, the tower of museum things stands up, he climbs it
// 19.5   the room goes dark, the paper moon lights up
// 23.5   the book shuts; a card lies on the table
// ============================================================
const HANDLE = '@superalesha', PW = 460, PD = 620, INK = '#2b2018';
const BASE = makePalette({ paper: '#f1e8d2', ink: INK, light: '#fffaf0', fills: ['#5f9a78', '#4f8a6a', '#7fb58f', '#f3d98b', '#e9a15f', '#8fb4d6'], accents: ['#c8473f', '#2f6db0', '#e0a526', '#4c9a6a'] }, 'doodlePastel');
const tf = (x, y, s, rot = 0, dir = 1) => (px, py) => { const X = px * s * dir, Y = py * s, ca = Math.cos(rot), sa = Math.sin(rot); return [x + X * ca - Y * sa, y + X * sa + Y * ca]; };
const M = (T, pts) => pts.map(p => T(p[0], p[1]));
const dot = (d, x, y, r, col) => d.mark((c, k) => { c.fillStyle = col || PAL.ink; c.beginPath(); c.arc(x, y, r * k, 0, TAU); c.fill(); }, .05);
const ink = (g, seed, build) => pen(g, 99, 0, -9, seed, build, { still: true });        // a finished doodle on a sheet

// ===================== PUPPET =====================
function hog(d, x, y, s, o = {}) { const { dir = 1, rot = 0, scarf = PAL.accents[0], eye = 'dot', hand = null, body = PAL.light, quills = '#b78d63', w = 3.6 } = o, T = tf(x, y, s, rot, dir);
  const B = [[-1, .15], [-.85, -.5], [-.3, -.92], [.35, -.85], [.8, -.45], [1.32, -.04], [.85, .35], [.5, .62], [-.4, .68], [-.9, .5]], Q = [[-1, .15], [-.85, -.5], [-.3, -.92], [.35, -.85], [.72, -.52], [.42, -.22], [.18, .12], [-.12, .47], [-.9, .5]];
  d.fill(splinePath(M(T, B)), body).wash(splinePath(M(T, Q)), quills, { al: .8, off: 2 }).line(M(T, B), { close: true, w }).line(M(T, [[.72, -.52], [.42, -.22], [.18, .12], [-.12, .47]]), { w: w * .8 });
  const sp = []; for (let k = 0; k < 11; k++) { const a = Math.PI * (1.08 + k * .105), cx = -.1 + Math.cos(a), cy = -.08 + Math.sin(a) * .88; sp.push(M(T, [[cx * .97, cy * .97], [cx * 1.22 - .08, cy * 1.22]])); } d.lines(sp, { w: w * .85 });
  d.line(M(T, [[.3, -.52], [.4, -.74], [.54, -.54]]), { w: w * .8 }); if (eye === 'happy') d.line(M(T, [[.64, -.14], [.74, -.25], [.84, -.14]]), { w: w * .85 }); else dot(d, ...T(.74, -.18), s * .075);
  dot(d, ...T(1.32, -.04), s * .1); d.wash(ellPath(...T(.62, .1), s * .17, s * .1), PAL.blush, { al: .8, off: 1 }); d.lines([[[-.45, .66], [-.47, .86], [-.25, .86]], [[.3, .6], [.3, .86], [.52, .86]]].map(p => M(T, p)), { w: w * .85 });
  if (scarf) { const S1 = [[.16, .1], [.5, .28], [.88, .34], [.84, .5], [.45, .47], [.1, .3]], S2 = [[.2, .28], [-.2, .38], [-.5, .22], [-.46, .46], [-.15, .56], [.2, .44]]; d.wash(splinePath(M(T, S2)), scarf, { al: .95, off: 2 }).wash(splinePath(M(T, S1)), scarf, { al: .95, off: 2 }).line(M(T, S2), { close: true, w: w * .7 }).line(M(T, S1), { close: true, w: w * .7 }); }
  if (hand) { const a = T(.5, .3), m = [(a[0] + hand[0]) / 2 + 6 * dir, (a[1] + hand[1]) / 2 + 10]; d.line([a, m, hand], { w: w * .9 }); dot(d, hand[0], hand[1], s * .09); } return d; }

// ===================== SHEETS =====================
let SH = null;
function paperGrain(g, w, h, seed, n = 500) { const r = rng(seed); g.fillStyle = 'rgba(90,70,40,.07)'; for (let k = 0; k < n; k++) g.fillRect(r() * w, r() * h, 1 + r() * 1.6, 1 + r() * 1.6); }
function pageSheet(side, lines, tau, t0, ground) { return (g, w, h) => { g.fillStyle = BASE.paper; g.fillRect(0, 0, w, h); paperGrain(g, w, h, side === 'L' ? 3 : 4);
    const gr = g.createLinearGradient(side === 'L' ? w : 0, 0, side === 'L' ? w - 90 : 90, 0); gr.addColorStop(0, 'rgba(60,40,20,.32)'); gr.addColorStop(1, 'rgba(60,40,20,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    if (ground) wash(g, splinePath(side === 'L' ? [[20, 120], [200, 80], [w + 30, 110], [w + 30, 430], [200, 470], [20, 440]] : [[-30, 110], [250, 84], [w - 20, 130], [w - 20, 440], [260, 466], [-30, 430]]), ground, { al: .5, off: 3, seed: 5 });
    g.strokeStyle = 'rgba(90,70,40,.28)'; g.lineWidth = 1.2; g.strokeRect(16, 16, w - 32, h - 32);
    lines.forEach(([str, x, y, size, dt], k) => pen(g, tau, 0, t0 + (dt ?? k * .9), 70 + k, d => d.text(str, x, y, { size, ink: INK, ink2: null }), { speed: 900 })); }; }
function buildSheets() { usePalette(BASE); const S0 = {};
  S0.table = tex3(1600, 1200, (g, w, h) => { g.fillStyle = '#6a4930'; g.fillRect(0, 0, w, h); const r = rng(9); for (let x = 0; x < w; x += 200) { g.fillStyle = `rgba(${40 + r() * 30 | 0},${25 + r() * 16 | 0},10,.${2 + (r() * 3 | 0)})`; g.fillRect(x, 0, 200, h); g.fillStyle = 'rgba(25,12,4,.55)'; g.fillRect(x - 1.5, 0, 3, h); }
    g.strokeStyle = 'rgba(30,15,5,.22)'; g.lineWidth = 1.4; for (let k = 0; k < 260; k++) { const x = r() * w, y = r() * h, l = 60 + r() * 260; g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + 6, y + l * .3, x - 6, y + l * .6, x + 3, y + l); g.stroke(); } }, 1);
  S0.cover = tex3(PW + 16, PD + 16, (g, w, h) => { g.fillStyle = '#27335c'; g.fillRect(0, 0, w, h); const r = rng(4); g.fillStyle = 'rgba(255,255,255,.035)'; for (let k = 0; k < 2600; k++) g.fillRect(r() * w, r() * h, 2, 1); const gold = '#e3c477';
    ink(g, 11, d => { d.line([[30, 30], [w - 30, 30], [w - 30, h - 30], [30, h - 30]], { close: true, smooth: false, w: 4, color: gold }).line([[44, 44], [w - 44, 44], [w - 44, h - 44], [44, h - 44]], { close: true, smooth: false, w: 1.8, color: gold });
      d.fill(circPath(w / 2, 200, 84), '#f4e6b0').line(ellPts(w / 2, 200, 84, 84, 0, 16), { close: true, w: 3.4, color: gold }); hog(d, w / 2 - 6, 470, 50, { rot: -.3, body: '#fffaf0' }); });
    handText(g, 'the hedgehog', w / 2, 352, { size: 62, ink: gold, ink2: null, align: 'center' }); handText(g, 'and the moon', w / 2, 590, { size: 62, ink: gold, ink2: null, align: 'center' }); }, 2);
  S0.sky = tex3(880, 470, (g, w, h) => { const p = new Path2D(); p.moveTo(0, h); p.lineTo(0, 190); p.bezierCurveTo(0, 40, 160, 0, w / 2, 0); p.bezierCurveTo(w - 160, 0, w, 40, w, 190); p.lineTo(w, h); p.closePath(); g.fillStyle = '#2a3463'; g.fill(p); g.save(); g.clip(p); wash(g, rectPath(-20, h - 170, w + 40, 200), '#5b6db0', { al: .55, off: 0, blend: 'source-over', seed: 3 });
    const r = rng(8); g.fillStyle = '#fff6d0'; for (let k = 0; k < 150; k++) { g.globalAlpha = .4 + r() * .6; g.beginPath(); g.arc(r() * w, r() * h * .85, .8 + r() * 1.8, 0, TAU); g.fill(); } g.globalAlpha = 1; g.restore();
    ink(g, 13, d => { [[120, 120, 11], [260, 60, 8], [640, 80, 10], [770, 170, 12], [420, 40, 7]].forEach(([x, y, s]) => d.lines([[[x - s, y], [x + s, y]], [[x, y - s], [x, y + s]]], { w: 2.4, color: '#fff6d0' })); }); g.strokeStyle = INK; g.lineWidth = 4; g.stroke(p); }, 2);
  S0.moon = tex3(260, 600, (g, w, h) => ink(g, 17, d => { const st = [[w / 2 - 8, 236], [w / 2 + 8, 236], [w / 2 + 8, h], [w / 2 - 8, h]]; d.fill(polyPath(st), '#efe6cf').line(st, { close: true, smooth: false, w: 2.6 });
      d.fill(circPath(w / 2, 126, 118), '#fbf1c9').wash(circPath(w / 2 + 6, 132, 108), '#f3d98b', { al: .7, off: 4 }).line(ellPts(w / 2, 126, 118, 118, 0, 20), { close: true, w: 4.4 });
      [[-44, -40, 17], [38, -58, 11], [50, 30, 20], [-20, 56, 12]].forEach(([x, y, r]) => d.wash(circPath(w / 2 + x, 126 + y, r), '#d9b86a', { al: .55, off: 1 }).line(ellPts(w / 2 + x, 126 + y, r, r, 0, 8), { close: true, w: 1.8, color: '#b09050' }));
      d.lines([[[w / 2 - 50, 120], [w / 2 - 38, 110], [w / 2 - 26, 120]], [[w / 2 + 6, 112], [w / 2 + 18, 102], [w / 2 + 30, 112]], [[w / 2 - 28, 150], [w / 2 - 8, 164], [w / 2 + 14, 150]]], { w: 3 }); }), 2);
  S0.pine = [0, 1, 2].map(v => tex3(180, 370, (g, w, h) => ink(g, 21 + v, d => { const col = BASE.fills[v], tr = [[w / 2 - 12, h - 70], [w / 2 + 12, h - 70], [w / 2 + 12, h], [w / 2 - 12, h]]; d.fill(polyPath(tr), '#a9805a').line(tr, { close: true, smooth: false, w: 3 });
      [[10, 300, 90], [26, 210, 72], [44, 130, 54]].forEach(([top, bot, half], k) => { const P = [[w / 2, top], [w / 2 + half * .45, lerp(top, bot, .55)], [w / 2 + half, bot], [w / 2 + half * .4, bot - 12], [w / 2, bot + 4], [w / 2 - half * .4, bot - 12], [w / 2 - half, bot], [w / 2 - half * .45, lerp(top, bot, .55)]]; d.fill(polyPath(P), '#f6f1e2').wash(polyPath(P), col, { al: .9, off: 2, seed: 30 + k + v }).line(P, { close: true, smooth: false, w: 3.4 }); }); }), 2));
  S0.hog = tex3(210, 170, (g, w, h) => ink(g, 31, d => hog(d, 96, 104, 56, { rot: -.32, eye: 'dot' })), 2);
  S0.grass = tex3(160, 70, (g, w, h) => ink(g, 33, d => { for (let k = 0; k < 7; k++) { const x = 14 + k * 21; d.line([[x, h], [x + (k % 2 ? 5 : -5), h - 26 - (k % 3) * 12], [x + (k % 2 ? 9 : -8), h - 44 - (k % 3) * 12]], { w: 3, color: BASE.accents[3] }); } }), 2);
  S0.violin = tex3(140, 400, (g, w, h) => photo(g, place('violin', { x: w / 2, y: h, h: 396, pivot: [.5, 1] }), { shadow: 0 }), 2);
  S0.lantern = tex3(160, 310, (g, w, h) => photo(g, place('lantern', { x: w / 2, y: h, h: 306, pivot: [.5, 1] }), { shadow: 0 }), 2);
  S0.tower = tex3(320, 860, null, 2); S0.pageL = [tex3(PW, PD, null, 2), tex3(PW, PD, null, 2)]; S0.pageR = [tex3(PW, PD, null, 2), tex3(PW, PD, null, 2)];
  S0.card = tex3(444, 132, (g, w, h) => { g.fillStyle = '#fffdf7'; g.fillRect(0, 0, w, h); ink(g, 41, d => { const X = (u, v) => [60 + u * 68, 66 + v * 68]; d.line([[2, 2], [w - 2, 2], [w - 2, h - 2], [2, h - 2]], { close: true, smooth: false, w: 3.2 }).line([X(-.5, -.5), X(-.2, -.5), X(.5, .5), X(.2, .5)], { close: true, smooth: false, w: 3.6 }).line([X(.46, -.5), X(.07, -.06)], { w: 3.6 }).line([X(-.07, .06), X(-.46, .5)], { w: 3.6 }); dot(d, w / 2, 16, 5.5, BASE.accents[0]); }); handText(g, HANDLE, 114, 86, { size: 53, ink: INK, ink2: null }); }, 2);
  return S0; }
function towerDraw(climb, reach) { return (g, w, h) => { usePalette(BASE); photo(g, place('helmet', { x: w / 2 + 6, y: h, h: 330, pivot: [.5, 1] }), { shadow: 0 }); photo(g, place('hourglass', { x: w / 2 - 4, y: h - 300, h: 250, pivot: [.5, 1] }), { shadow: 0 }); photo(g, place('watch', { x: w / 2 + 4, y: h - 528, h: 215, pivot: [.5, 1], rot: .1 }), { shadow: 0 });
    ink(g, 51, d => { const L0 = [44, h - 4], L1 = [92, 118], R0 = [84, h - 4], R1 = [132, 118]; d.line([L0, L1], { w: 3.4 }).line([R0, R1], { w: 3.4 }); for (let k = 1; k < 15; k++) { const u = k / 15; d.line([[lerp(L0[0], L1[0], u), lerp(L0[1], L1[1], u)], [lerp(R0[0], R1[0], u), lerp(R0[1], R1[1], u)]], { w: 2.6 }); } });
    const top = climb >= 1, hx = top ? w / 2 + 10 : lerp(64, 112, climb) + 6, hy = top ? 74 : lerp(h - 60, 150, climb), bob = top ? 0 : Math.sin(climb * 40) * 3;
    ink(g, 53, d => hog(d, hx, hy + bob, 44, { rot: top ? -.2 : -1.0, eye: top && reach > .6 ? 'happy' : 'dot', hand: top ? [hx + 70 + reach * 26, hy - 40 - reach * 22] : null })); }; }

// ===================== THE BOOK =====================
let BOOK = null;
function build() { SH = buildSheets(); BOOK = book3({ PW, PD, cover: SH.cover, spreads: [
  { left: SH.pageL[0], right: SH.pageR[0], pieces: [ { base: [[-440, -285], [440, -285]], h: 470, sheet: SH.sky, mesh: 12 }, { base: [[-130, -215], [130, -215]], h: 600, sheet: SH.moon, mesh: 10 },
      { base: [[-445, -150], [-265, -150]], h: 370, sheet: SH.pine[0] }, { base: [[-330, -30], [-150, -30]], h: 400, sheet: SH.pine[1] }, { base: [[-452, 70], [-302, 70]], h: 300, sheet: SH.pine[2] }, { base: [[262, -160], [442, -160]], h: 360, sheet: SH.pine[1] }, { base: [[160, -40], [340, -40]], h: 410, sheet: SH.pine[0] }, { base: [[330, 60], [452, 60]], h: 250, sheet: SH.pine[2] },
      { base: [[-40, 150], [170, 150]], h: 170, sheet: SH.hog, shadow: true }, { base: [[-270, 215], [-110, 215]], h: 70, sheet: SH.grass }, { base: [[200, 225], [360, 225]], h: 70, sheet: SH.grass } ] },
  { left: SH.pageL[1], right: SH.pageR[1], pieces: [ { base: [[-440, -285], [440, -285]], h: 470, sheet: SH.sky, mesh: 12 }, { base: [[70, -225], [330, -225]], h: 600, sheet: SH.moon, mesh: 10, key: 'moon' },
      { base: [[-330, -70], [-10, -70]], h: 860, sheet: SH.tower, mesh: 14 }, { base: [[-450, 110], [-310, 110]], h: 400, sheet: SH.violin, lean: 74 }, { base: [[290, 150], [450, 150]], h: 310, sheet: SH.lantern }, { base: [[60, 215], [220, 215]], h: 70, sheet: SH.grass } ] } ] }); }

// ===================== THE FILM =====================
const K = (t, a, b, e = easeIO) => sm(a, b, t, e), mix3 = (a, b, t) => V3.lerp(a, b, t);
function camAt(t) { let eye = [270, 800, 690], tg = [236, 10, 30]; const path = [[0, [300, 840, 760], [236, 10, 30]], [2.2, [262, 760, 650], [236, 10, 30]], [4.2, [-240, 900, 1200], [0, 140, -40]], [9.2, [250, 830, 1080], [0, 170, -30]], [11.4, [170, 640, 860], [40, 230, -40]], [12.4, [0, 1000, 1300], [0, 170, -40]], [14.0, [-260, 960, 1230], [-60, 200, -40]],
    [18.6, [60, 1120, 1120], [-90, 520, -60]], [20.5, [150, 1000, 1100], [10, 520, -120]], [23.4, [120, 980, 1130], [10, 500, -120]], [25.4, [520, 1240, 1260], [480, 10, 70]], [29, [500, 1160, 1180], [480, 10, 70]]];
  for (let k = 0; k + 1 < path.length; k++) if (t >= path[k][0]) { const u = easeIO(clamp((t - path[k][0]) / (path[k + 1][0] - path[k][0]), 0, 1)); eye = mix3(path[k][1], path[k + 1][1], u); tg = mix3(path[k][2], path[k + 1][2], u); } return { eye, target: tg, f: 1500 }; }
function film(c, tau, i) { if (!BOOK) build(); usePalette(BASE); const turn = tau < 2.2 ? 0 : tau < 4.0 ? K(tau, 2.2, 4.0) : tau < 11.5 ? 1 : tau < 13.3 ? 1 + K(tau, 11.5, 13.3) : tau < 23.6 ? 2 : 2 - 2 * K(tau, 23.6, 25.6), dim = K(tau, 19.4, 20.8) * (1 - K(tau, 23.2, 24.2)), climb = K(tau, 14.2, 18.4, t => t), reach = K(tau, 18.5, 19.4);
  SH.pageL[0].redraw(pageSheet('L', [['Every night', 36, 486, 48], ['the hedgehog looked', 36, 538, 48], ['at the moon.', 36, 590, 48]], tau, 4.6, '#a9c7a0')); SH.pageR[0].redraw(pageSheet('R', [['The moon', 190, 538, 48, 0], ['looked back.', 190, 590, 48, .7]], tau, 8.0, '#a9c7a0'));
  SH.pageL[1].redraw(pageSheet('L', [['So he stacked up', 36, 486, 48], ['everything', 36, 538, 48], ['the museum had.', 36, 590, 48]], tau, 13.6, '#c9c2a0')); SH.pageR[1].redraw(pageSheet('R', [['Almost.', 230, 580, 56, 0]], tau, 18.7, '#c9c2a0')); SH.tower.redraw(towerDraw(climb, reach));
  resetT(c); c.fillStyle = '#120c09'; c.fillRect(0, 0, W, H); cam3(camAt(tau)); quad3(c, SH.table, [[-2300, -2, -1900], [2300, -2, -1900], [2300, -2, 1550], [-2300, -2, 1550]], { n: 16, dark: .12 });
  { const g = shadowsBegin(); g.setTransform(c.getTransform()); const openW = turn > 0 ? 1 : 0, x0 = -(PW + 14) * Math.min(1, turn), Q = [[x0 - 10, 60, -PD / 2 - 14], [PW + 24, 60, -PD / 2 - 14], [PW + 24, 60, PD / 2 + 14], [x0 - 10, 60, PD / 2 + 14]]; shadow3(g, SH.card, Q, [0, -1, 0], [0, 1, 0], null, 1); shadowsEnd(c, .38); }
  BOOK.draw(c, { turn });
  if (tau > 24.6) { const a = K(tau, 24.6, 25.5, easeOut), cx = 745 + (1 - a) * 600, cz = 190, rot = -.14, w = 222, h = 66, ca = Math.cos(rot), sa = Math.sin(rot), P = [[-w, -h], [w, -h], [w, h], [-w, h]].map(([x, z]) => [cx + x * ca - z * sa, 1.5, cz + x * sa + z * ca]); const g = shadowsBegin(); g.setTransform(c.getTransform()); shadow3(g, SH.card, P.map(p => [p[0], 14, p[2]]), [0, 0, 0], [0, 1, 0], null, 1); shadowsEnd(c, .3); quad3(c, SH.card, P, { n: 6, dark: .05 }); }
  // the lamp over the table, and later the dark with the paper moon alight
  resetT(c); const vg = c.createRadialGradient(CX - 60, CY - 40, 260, CX, CY, 860); vg.addColorStop(0, 'rgba(10,5,0,0)'); vg.addColorStop(1, 'rgba(10,5,0,.5)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
  if (dim > 0) { const m = proj3([200, 480 + 14, -225]); nightfall(c, .78 * dim, '#232a55'); glow(c, m[0], m[1], 420 * dim, '#ffe9a8', .8 * dim); glow(c, m[0], m[1], 130 * dim, '#fff6d0', .6 * dim); const ln = proj3([370, 190, 150]); glow(c, ln[0], ln[1], 130 * dim, '#ffcf70', .7 * dim);
    usePalette(chalkPalette(BASE)); pen(c, tau, i, 20.9, 91, d => d.text('it was only paper.', 70, 960, { size: 62, ink: '#f7f3e8', ink2: null })); pen(c, tau, i, 22.0, 92, d => d.text('he loved it anyway.', 70, 1030, { size: 62, ink: '#f7f3e8', ink2: null })); usePalette(BASE); } }

// ===================== SCORE =====================
function score(ac, t0, dest) { const master = ac.createGain(); master.gain.value = .5; master.connect(dest); const hz = (o, s) => pentHz(o, s, 220), box = (t, f, g = .18, d = 1.2) => { note(ac, master, f, t0, t, d, 'sine', g); note(ac, master, f * 2, t0, t, d * .5, 'triangle', g * .22); note(ac, master, f * 4, t0, t, d * .2, 'sine', g * .06); };
  const swish = (t, d, g) => { for (let k = 0; k < 6; k++) noiseBurst(ac, master, t0, t + k * d / 6, d / 3, g * (.5 + .5 * Math.sin(k / 5 * Math.PI)), 3 + k); };
