<!doctype html>
<meta charset="utf-8">
<title>night shift</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(92vw,720px);height:auto;background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1080" height="1080"></canvas>
<script src="../assets/core.js"></script>
<script src="night-shift-photos.js"></script>
<script>
'use strict';
// ============================================================
// NIGHT SHIFT. A museum at night. The guard lights the lantern, the flame grows legs and runs,
// and the chase goes through nine objects until morning. You cannot keep a light in a jar.
// Photos: The Metropolitan Museum of Art, Open Access (CC0). Credits and sources are in night-shift-photos.js.
//
// Square only: scenes use literal frame positions for the ground and the paths.
// Anchor: the spark, and the pool of light it carries. 120 bpm, a beat is 6 drawn frames, every cut is on a beat.
// t      dur  scene      paper   object -> becomes              what happens                                         sound
// 0.0    3.5  lantern    lilac   lantern -> where the light lives  match, flame wakes, hops out, "hey!"              match, bell, the beat starts
// 3.5    2.5  violin     sky     violin -> a bridge             both run along its real top edge, a note per step    plucks
// 6.0    2.5  watch      mint    watch -> a merry-go-round      the spark rides a drawn hand round and is flung      ticks, whirr
// 8.5    2.0  trumpet    butter  trumpet -> a tunnel            light travels through the tube, TOOT, recoil         brass blast
// 10.5   3.0  helmet     rose    helmet -> a dragon             eyes light up, roar, hedgehog jumps, "hee hee"       growl
// 13.5   2.5  knight     cream   chess knight -> a getaway horse  gallop with the camera, hobby horse behind         clop clop
// 16.0   2.5  harp       peach   harp -> a ladder               up the soundboard, strings ring, umbrella down       glissando
// 18.5   2.5  hourglass  lilac   sandglass -> a trap            falls through the neck with the sand, tired          falling notes, tap tap
// 21.0   3.5  jar        lilac   lantern -> a jar               caught, it dims, he lets it go                       music box alone
// 24.5   3.0  sunrise    peach   fan -> the sun                 the fan rises behind a drawn hill, night ends        full chord
// 27.5   3.5  end        cream   lantern, unlit                 asleep on the job, sign-off, a museum label with the author's handle   last notes
// ============================================================

const HANDLE = '@superalesha';   // the author's handle on the museum label of the last shot: put your own here
const GY = 930, SPARK = '#ffd36b', WARM = '#ffcf70', HS = 70, HY = 62, SS = 34, SY = 45;   // hedgehog and spark sizes, and how high their centres sit above what they stand on
// follow: the camera leans towards the action and whips on the cuts
const follow = (p, tau, D, zoom = 1.16, o = {}) => setView({ x: CX + (p[0] - CX) * (o.kx ?? .35) + whip(tau, D, o), y: CY + (p[1] - CY) * (o.ky ?? .22) + (o.dy || 0), zoom });
const tf = (x, y, s, rot = 0, dir = 1) => (px, py) => { const X = px * s * dir, Y = py * s, ca = Math.cos(rot), sa = Math.sin(rot); return [x + X * ca - Y * sa, y + X * sa + Y * ca]; };
const M = (T, pts) => pts.map(p => T(p[0], p[1]));
const dot = (d, x, y, r, col) => d.mark((c, k) => { c.fillStyle = col || PAL.ink; c.beginPath(); c.arc(x, y, r * k, 0, TAU); c.fill(); }, .05);
const hop = (a, b, t, h) => { t = clamp(t, 0, 1); return [lerp(a[0], b[0], t), lerp(a[1], b[1], t) - Math.sin(t * Math.PI) * h]; };
const lin = (a, b, t) => [lerp(a[0], b[0], clamp(t, 0, 1)), lerp(a[1], b[1], clamp(t, 0, 1))];
const NOW = { start: -9 };   // a doodle that is already on the paper

// ===================== PUPPETS =====================
// hedgehog: faces +x when dir = 1. run = phase of the run cycle (or null), fright = quills up, hand = [x, y] in frame units
function hog(d, x, y, s, o = {}) { const { dir = 1, rot = 0, scarf = PAL.accents[0], eye = 'dot', hand = null, body = PAL.light, quills = '#b78d63', w = 4, run = null, fright = 0 } = o;
  const bobY = run === null ? 0 : -Math.abs(Math.sin(run)) * s * .12, T = tf(x, y + bobY, s, rot + (run === null ? 0 : .1), dir);
  const B = [[-1, .15], [-.85, -.5], [-.3, -.92], [.35, -.85], [.8, -.45], [1.32, -.04], [.85, .35], [.5, .62], [-.4, .68], [-.9, .5]], Q = [[-1, .15], [-.85, -.5], [-.3, -.92], [.35, -.85], [.72, -.52], [.42, -.22], [.18, .12], [-.12, .47], [-.9, .5]];
  d.fill(splinePath(M(T, B)), body).wash(splinePath(M(T, Q)), quills, { al: .75, off: 3 }).line(M(T, B), { close: true, w }).line(M(T, [[.72, -.52], [.42, -.22], [.18, .12], [-.12, .47]]), { w: w * .8 });
  const sp = [], L = 1.22 + fright * .45; for (let k = 0; k < 11; k++) { const a = Math.PI * (1.08 + k * .105), cx = -.1 + Math.cos(a), cy = -.08 + Math.sin(a) * .88; sp.push(M(T, [[cx * .97, cy * .97], [cx * L - .08 * (1 - fright), cy * L]])); }
  d.lines(sp, { w: w * .85, dur: .05, stagger: .025 }).lines([[[-.45, -.35], [-.55, -.5]], [[-.1, -.45], [-.18, -.62]], [[-.55, .05], [-.68, -.08]], [[-.2, -.05], [-.3, -.2]], [[.15, -.4], [.1, -.57]]].map(p => M(T, p)), { w: w * .7, dur: .04, stagger: .02 });
  d.line(M(T, [[.3, -.52], [.4, -.74], [.54, -.54]]), { w: w * .8 });
  if (eye === 'happy') d.line(M(T, [[.64, -.14], [.74, -.25], [.84, -.14]]), { w: w * .85 }); else if (eye === 'sleep') d.line(M(T, [[.64, -.2], [.74, -.12], [.84, -.2]]), { w: w * .85 });
  else if (eye === 'wide') { d.fill(circPath(...T(.74, -.2), s * .15), '#fffdf7').line(ellPts(...T(.74, -.2), s * .15, s * .15, 0, 8), { close: true, w: w * .6 }); dot(d, ...T(.77, -.2), s * .06); } else dot(d, ...T(.74, -.18), s * .075);
  dot(d, ...T(1.32, -.04), s * .1); d.wash(ellPath(...T(.62, .1), s * .17, s * .1), PAL.blush, { al: .8, off: 1 });
  const sw = run === null ? 0 : Math.sin(run) * .42, legs = run === null ? [[[-.45, .66], [-.47, .86], [-.25, .86]], [[.3, .6], [.3, .86], [.52, .86]]] : [[[-.35, .62], [-.35 + sw, .9]], [[.25, .6], [.25 - sw, .9]]];
  d.lines(legs.map(p => M(T, p)), { w: w * .85 });
  if (scarf) { const fl = run === null ? 0 : Math.sin(run * 1.3) * .14, S1 = [[.16, .1], [.5, .28], [.88, .34], [.84, .5], [.45, .47], [.1, .3]], S2 = [[.2, .28], [-.25, .3 + fl], [-.7, .1 - fl], [-.72, .34 - fl], [-.25, .5 + fl], [.2, .44]];
    d.wash(splinePath(M(T, S2)), scarf, { al: .95, off: 2 }).wash(splinePath(M(T, S1)), scarf, { al: .95, off: 2 }).line(M(T, S2), { close: true, w: w * .7 }).line(M(T, S1), { close: true, w: w * .7 }); }
  if (hand) { const a = T(.5, .3), m = [(a[0] + hand[0]) / 2 + 6 * dir, (a[1] + hand[1]) / 2 + 10]; d.line([a, m, hand], { w: w * .9 }); dot(d, hand[0], hand[1], s * .09); }
  return d; }
// spark: the flame with legs. Its colours are fixed, so it looks the same in the ink pass and the chalk pass.
function spark(d, x, y, s, o = {}) { const { dir = 1, run = null, mood = 'happy', lean = 0, squash = 1 } = o, T = tf(x, y, s, 0, dir), k = squash, line = '#9c5416';
  const B = [[-lean * 1.2, -1.55 * k], [.5 - lean * .4, -.6 * k], [.78, .15], [.5, .8], [0, .95], [-.5, .8], [-.78, .15], [-.42 - lean * .4, -.55 * k]];
  d.fill(splinePath(M(T, B)), '#fff4b8').wash(splinePath(M(T, B.map(([a, b]) => [a * .82, b * .82 + .16]))), '#ffab2e', { al: .8, off: 1, blend: 'source-over' }).line(M(T, B), { close: true, w: 3.2, color: line });
  const e = mood === 'sad' ? .12 : 0; dot(d, ...T(.12, .0 + e), s * .085, '#3a2414'); dot(d, ...T(.46, .0 + e), s * .085, '#3a2414');
  if (mood === 'happy') d.line(M(T, [[.16, .3], [.3, .42], [.44, .3]]), { w: 2.4, color: '#3a2414' }); else if (mood === 'sad') d.line(M(T, [[.16, .46], [.3, .36], [.44, .46]]), { w: 2.4, color: '#3a2414' }); else dot(d, ...T(.3, .38), s * .1, '#3a2414');
  const sw = run === null ? 0 : Math.sin(run) * .5; d.lines((run === null ? [[[-.25, .9], [-.25, 1.3]], [[.25, .9], [.25, 1.3]]] : [[[-.2, .9], [-.2 + sw, 1.32]], [[.2, .9], [.2 - sw, 1.32]]]).map(p => M(T, p)), { w: 3, color: line }); return d; }
// the sparks it drops: positions it had a moment ago
function trail(c, path, tau, n = 9, step = .07) { c.save(); for (let k = 1; k <= n; k++) { const p = path(tau - k * step); if (!p) continue; const r = rng(k * 7 + Math.floor(tau * 12)); c.fillStyle = k % 2 ? SPARK : '#fff1c0'; c.globalAlpha = 1 - k / (n + 1); c.beginPath(); c.arc(p[0] + (r() - .5) * 16, p[1] + (r() - .5) * 16 + k * 2, 4.5 * (1 - k / (n + 2)) + 1, 0, TAU); c.fill(); } c.restore(); }
const heartPts = (x, y, s) => Array.from({ length: 18 }, (_, k) => { const a = k / 18 * TAU; return [x + s * Math.pow(Math.sin(a), 3), y - s * (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 16]; });
function sparkle(d, x, y, s, col) { d.lines([[[x - s, y], [x + s, y]], [[x, y - s], [x, y + s]], [[x - s * .5, y - s * .5], [x + s * .5, y + s * .5]], [[x + s * .5, y - s * .5], [x - s * .5, y + s * .5]]], { w: 2.4, dur: .04, stagger: .02, color: col }); return d; }
function musicNote(d, x, y, s, col) { d.mark((c, k) => { c.save(); c.translate(x, y); c.rotate(-.4); c.fillStyle = col || PAL.ink; c.beginPath(); c.ellipse(0, 0, s * .42 * k, s * .3 * k, 0, 0, TAU); c.fill(); c.restore(); }, .05).line([[x + s * .36, y - s * .1], [x + s * .4, y - s * 1.3], [x + s * .9, y - s * .95]], { w: 3, color: col }); return d; }
const ground = (d, y = GY, x0 = -900, x1 = W + 900) => d.line([[x0, y + 3], [lerp(x0, x1, .3), y - 2], [lerp(x0, x1, .65), y + 4], [x1, y]], { w: 3.6 });
const stars = (d, list) => list.forEach(([x, y, s]) => sparkle(d, x, y, s, '#ffe9a8'));
function trestle(d, x, top, w = 70) { d.lines([[[x, top], [x - w, GY]], [[x, top], [x + w, GY]], [[x - w * .55, lerp(top, GY, .6)], [x + w * .55, lerp(top, GY, .6)]]], { w: 3.4 }); }

// ===================== SCENES =====================
function sLantern(c, tau, i) { const D = 3.5; usePalette(pastel('lilac'));
  const pl = place('lantern', { x: 560, y: GY, h: 700, pivot: [.5, 1] }), F = on(pl, .52, .62), lit = sm(.85, 1.05, tau), match = on(pl, -.02, .74);
  const path = t => t < 1.95 ? F : t < 2.55 ? hop(F, [830, GY - SY], (t - 1.95) / .6, 300) : [830 + (t - 2.55) * 480, GY - SY], sp = path(tau), hx = tau < 2.7 ? 235 : 235 + Math.pow(tau - 2.7, 1.4) * 700; follow([lerp(440, sp[0], sm(1.9, 2.6, tau)), 640], tau, D, 1.08 + .1 * sm(0, 1.9, tau), { inn: 0, kx: .5 });
  nightShot(c, c => { backdrop(c); pen(c, tau, i, -9, 1, d => ground(d), { still: true }); photo(c, pl);
    pen(c, tau, i, 1.0, 31, d => stars(d, [[150, 160, 12], [330, 90, 9], [880, 140, 13], [980, 330, 9], [760, 70, 8], [90, 420, 8]]));
    pen(c, tau, i, .05, 7, d => { hog(d, hx, GY - HY, HS, { dir: 1, hand: tau < 1.5 ? [match[0] - 46, match[1] + 40] : null, eye: tau > 2.0 ? 'wide' : 'dot', run: tau > 2.7 ? tau * 15 : null, fright: sm(2.0, 2.2, tau) * (1 - sm(2.6, 2.8, tau)) }); if (tau < 1.5) d.line([[match[0] - 46, match[1] + 40], match], { w: 3 }); }, NOW);
    if (tau > 1.35) pen(c, tau, i, -9, 9, d => spark(d, sp[0], sp[1], tau < 1.95 ? 24 : SS, { run: tau > 2.55 ? tau * 17 : null, mood: tau < 1.95 ? 'o' : 'happy', lean: tau > 2.55 ? .25 : 0 }));
    if (tau > 1.95) trail(c, path, tau);
    pen(c, tau, i, 1.1, 41, d => d.text('night shift', 470, 250, { size: 92, align: 'center' }));
    if (tau > 2.1) pen(c, tau, i, 2.1, 43, d => d.text('hey!', hx - 50, GY - 200, { size: 80 }));
  }, { k: .88, lights: [{ x: match[0], y: match[1], r: 150 * sm(.2, .4, tau) * (1 - sm(1.2, 1.5, tau)), color: '#ffb84a' }, { x: sp[0], y: sp[1], r: (tau < 1.95 ? 470 : 330) * lit * (1 + Math.sin(i * 1.9) * .05), color: WARM }] }); }

function sViolin(c, tau, i) { const D = 2.5; usePalette(pastel('sky'));
  const pl = place('violin', { x: 540, y: 600, h: 900, rot: -Math.PI / 2 }), top = v => { const p = rim(pl, 'right', v); return [p[0], p[1]]; };
  const runner = (t0, t1, s) => t => { const v = (t - t0) / (t1 - t0); if (v < 0) return hop([-80, 560], top(0), 1 + v * 4, 120); if (v > 1) return hop(top(1), [1240, 640], (v - 1) * 3.2, 90); const p = top(v); return [p[0], p[1] - s]; };
  const pa = runner(.15, 1.55, SY), pb = runner(.6, 2.1, HY), sp = pa(tau), hp = pb(tau); follow([(sp[0] + hp[0]) / 2, 520], tau, D, 1.2, { kx: .45 });
  nightShot(c, c => { backdrop(c); pen(c, tau, i, -9, 1, d => { ground(d); trestle(d, 640, top(.55)[1] + 250); trestle(d, 900, top(.9)[1] + 290); }, { still: true }); photo(c, pl, { shadow: 0 });
    [.18, .36, .54, .72, .9].forEach((v, k) => { const t0 = .15 + v * 1.4; if (tau > t0) { const p = top(v), up = (tau - t0) * 90; pen(c, tau, i, t0, 50 + k, d => musicNote(d, p[0] - 10, p[1] - 110 - up, 24, k % 2 ? PAL.accents[0] : PAL.accents[1])); } });
    const amp = 9 * sm(.2, .5, tau) * (1 - sm(1.3, 2.0, tau)); if (amp > .3) for (let s = 0; s < 3; s++) brush(c, Array.from({ length: 24 }, (_, k) => { const p = on(pl, .42 + s * .07, .06 + k * .0235); return [p[0], p[1] + Math.sin(k * 1.5 + i * 2.3 + s) * amp]; }), { w: 2, color: PAL.accents[1], amp: 0, taper: 0 });
    pen(c, tau, i, -9, 7, d => hog(d, hp[0], hp[1], HS, { run: tau * 15, eye: 'dot' })); pen(c, tau, i, -9, 9, d => spark(d, sp[0], sp[1], SS, { run: tau * 17, lean: .25 })); trail(c, pa, tau);
    pen(c, tau, i, .5, 41, d => stars(d, [[120, 170, 11], [420, 110, 9], [760, 190, 12], [960, 90, 9]]));
  }, { k: .88, lights: [{ x: sp[0], y: sp[1], r: 330, color: WARM }] }); }

function sWatch(c, tau, i) { const D = 2.5; usePalette(pastel('mint'));
  const pl = place('watch', { x: 540, y: GY - 6, h: 680, pivot: [.5, 1] }), hub = on(pl, .49, .652), R = pl.w * .37, ang = t => Math.PI + Math.pow(sm(.35, 1.7, t, x => x), 1.7) * Math.PI * 2.5, tip = a => [hub[0] + Math.cos(a) * R, hub[1] + Math.sin(a) * R];
  const path = t => t < .35 ? hop([-60, 640], tip(Math.PI), t / .35, 140) : t < 1.7 ? (p => [p[0], p[1] - 34])(tip(ang(t))) : hop([hub[0], hub[1] - R - 34], [1300, 250], (t - 1.7) / .55, 60), sp = path(tau);
  const hx = tau < 1.75 ? lerp(-90, 170, sm(.3, 1.0, tau, easeOut)) : 170 + (tau - 1.75) * 1300; follow([lerp(hub[0], sp[0], .4), hub[1] - 40], tau, D, 1.1 + .1 * sm(.3, 1.7, tau));
  nightShot(c, c => { backdrop(c); pen(c, tau, i, -9, 1, d => ground(d), { still: true });
    if (tau >= 1.75) pen(c, tau, i, -9, 7, d => hog(d, hx, GY - HY, HS, { run: tau * 15 }));   // he goes round the back of it
    photo(c, pl);
    if (tau < 1.75) pen(c, tau, i, -9, 7, d => hog(d, hx, GY - HY, HS, { run: tau < 1.0 ? tau * 15 : null, eye: tau > 1.0 ? 'wide' : 'dot', rot: tau > 1.0 ? -.18 : 0 }));
    if (tau > .3) { const a = ang(Math.min(tau, 1.7)); for (let g = 4; g >= 1; g--) { const ag = ang(Math.min(tau, 1.7) - g * .05); if (Math.abs(ag - a) > .02) brush(c, [hub, tip(ag)], { w: 5, color: PAL.accents[0], amp: 0, al: .12 * (5 - g), seed: 2 }); }
      brush(c, [hub, tip(a)], { w: 8, color: PAL.accents[0], seed: 2, amp: .5, p: sm(.3, .4, tau) }); c.fillStyle = PAL.accents[0]; c.beginPath(); c.arc(hub[0], hub[1], 11, 0, TAU); c.fill(); }
    pen(c, tau, i, .5, 15, d => d.lines([[[250, 470], [222, 540], [250, 610]], [[212, 445], [176, 540], [212, 635]], [[830, 470], [858, 540], [830, 610]], [[868, 445], [904, 540], [868, 635]]], { w: 3.4, stagger: .06 }));
    pen(c, tau, i, .7, 17, d => d.text('tick', 100, 330, { size: 60 })); pen(c, tau, i, 1.0, 18, d => d.text('tick', 860, 350, { size: 60 })); pen(c, tau, i, 1.3, 19, d => d.text('tick!', 170, 190, { size: 74 }));
    pen(c, tau, i, -9, 9, d => spark(d, sp[0], sp[1], SS, { mood: tau > .6 && tau < 1.7 ? 'o' : 'happy', lean: tau > .35 ? .3 : .2 })); trail(c, path, tau, 11, .045);
  }, { k: .88, lights: [{ x: sp[0], y: sp[1], r: 340, color: WARM }] }); }

function sTrumpet(c, tau, i) { const D = 2.0; usePalette(pastel('butter')); const kick = tau > 1.0 ? Math.exp(-(tau - 1.0) * 7) : 0;
  const pl = place('trumpet', { x: 540 - kick * 46, y: 500, h: 980, rot: -Math.PI / 2 + kick * .03 * Math.sin(tau * 60) }), mouth = on(pl, .27, .0), bell = on(pl, .5, 1.0);
  const inside = tau > .3 && tau < 1.0, path = t => t < .3 ? hop([-80, 760], mouth, t / .3, 220) : t < 1.0 ? on(pl, .45, (t - .3) / .7) : hop(bell, [1320, 420], (t - 1.0) / .5, 70), sp = path(tau);
  follow([sp[0], 640], tau, D, 1.1 + kick * .08, { kx: .3, ky: 0 });
  const hx = tau < 1.15 ? lerp(-90, 130, sm(.35, .9, tau, easeOut)) - kick * 60 : 130 + Math.pow(tau - 1.15, 1.2) * 1250;
  nightShot(c, c => { backdrop(c); pen(c, tau, i, -9, 1, d => { ground(d); trestle(d, 330, 560, 60); trestle(d, 820, 590, 60); }, { still: true }); photo(c, pl, { shadow: 0 });
    pen(c, tau, i, -9, 7, d => hog(d, hx, GY - HY, HS, { run: tau > 1.15 || tau < .9 ? tau * 15 : null, eye: tau > .9 && tau < 1.3 ? 'wide' : 'dot', rot: tau > .9 && tau < 1.15 ? -.3 : 0, fright: kick }));
    if (!inside) { pen(c, tau, i, -9, 9, d => spark(d, sp[0], sp[1], SS, { lean: .3, mood: tau > 1 ? 'o' : 'happy' })); trail(c, path, tau, 10, .04); }
    if (tau > 1.0) { pen(c, tau, i, 1.0, 21, d => d.lines([0, 1, 2].map(k => Array.from({ length: 9 }, (_, j) => { const a = -1.0 + j * .25, r = 70 + k * 58 + (tau - 1) * 120; return [bell[0] + 10 + Math.cos(a) * r * .55, bell[1] + Math.sin(a) * r]; })), { w: 4, stagger: .04, speed: 3000 }), { still: true });
      pen(c, tau, i, 1.02, 23, d => d.text('TOOT!', 560, 300, { size: 120 }), { speed: 4000 }); [[880, 250], [960, 700], [800, 760]].forEach(([x, y], k) => pen(c, tau, i, 1.05 + k * .08, 25 + k, d => musicNote(d, x + (tau - 1) * 60, y - (tau - 1) * 50, 30, PAL.accents[k % 2 ? 1 : 0]))); }
  }, { k: .88, lights: [{ x: sp[0], y: sp[1], r: inside ? 230 : 330 + kick * 300, color: WARM }] }); }

function sHelmet(c, tau, i) { const D = 3.0; usePalette(pastel('rose')); const roar = sm(1.15, 1.3, tau) * (1 - sm(1.75, 1.95, tau));

function score(ac, t0, dest) { const master = ac.createGain(); master.gain.value = .55; master.connect(dest); const B = .5, hz = (o, s) => pentHz(o, s, 220), minor = [0, 3, 5, 7, 10], mhz = (o, s) => 110 * Math.pow(2, o + minor[((s % 5) + 5) % 5] / 12 + Math.floor(s / 5));
  const box = (t, f, g = .2, d = .9) => { note(ac, master, f, t0, t, d, 'sine', g); note(ac, master, f * 2, t0, t, d * .5, 'triangle', g * .22); };

  noiseBurst(ac, master, t0, .25, .12, .2, 1); box(.9, hz(2, 0), .3, 2); box(.9, hz(1, 2), .2, 2); box(2.0, hz(2, 2), .22); box(2.25, hz(2, 3), .22); box(2.5, hz(2, 4), .25);

  const cuts = [3.5, 6, 8.5, 10.5, 13.5, 16, 18.5, 21]; cuts.slice(0, -1).forEach((a, n) => { const root = n; for (let t = a, k = 0; t < cuts[n + 1] - .01; t += B / 2, k++) { note(ac, master, mhz(2, root + [0, 2, 4, 2, 3, 4, 2, 1][k % 8]), t0, t, .16, 'square', .045); if (k % 2 === 0) note(ac, master, mhz(0, root + (k % 8 === 4 ? 3 : 0)), t0, t, .28, 'sawtooth', .1); } noiseBurst(ac, master, t0, a, .18, .22, 40 + n); });

  for (let k = 0; k < 9; k++) noiseBurst(ac, master, t0, 6.3 + k * (.19 - k * .012), .025, .2, k + 3);                                        // watch ticks, speeding up

  for (let t = 13.6; t < 15.9; t += .25) { noiseBurst(ac, master, t0, t, .03, .22, 5); noiseBurst(ac, master, t0, t + .08, .03, .15, 6); }     // clop clop
  for (let k = 0; k < 14; k++) box(16.3 + k * .07, hz(1 + Math.floor(k / 5), k % 5), .13, .6);                                                   // harp glissando
  for (let k = 0; k < 7; k++) box(19.1 + k * .09, hz(3 - Math.floor(k / 3), 4 - (k % 3) * 2), .14, .5); [20.55, 20.75, 21.0].forEach(t => noiseBurst(ac, master, t0, t, .03, .2, 8));   // falling, tap tap

  [[0, 0], [0, 2], [1, 0], [1, 2], [1, 4]].forEach(([o, s]) => { note(ac, master, hz(o, s), t0, 24.5, 3.2, 'triangle', .13); note(ac, master, hz(o, s), t0, 24.5, 3.2, 'sine', .13); }); kick(24.5);
