// Fixed ground contacts are copied as drawing landmarks; no rotated limb pieces.
for (const p of Object.values(K)) for (const id of ['legA','legB','footA','footB']) p[id] ??= K.rest[id];
const raw = p => {
 const strokes=[];
 const add=(id,points,width=1.7,opacity=1,extra={})=>strokes.push({id,points,width,opacity,pressure,...extra});
 // The branch sits behind the feet. Legs are put down before the breast marks.
 for(const id of ['legA','legB']) add(id,p[id],2,.85,{corner:.9});
 for(const id of ['footA','footB']) {
  add(id,p[id],2.1,.95,{corner:1});
  const a=p[id]; add(id+'/backtoe',[[a[1][0],a[1][1]+1],[a[1][0]-8,a[1][1]+10],[a[1][0]-13,a[1][1]+8]],1.3,.8);
  add(id+'/claw',[[a[3][0]-2,a[3][1]-2],[a[3][0]+2,a[3][1]+3],[a[3][0],a[3][1]+5]],1.1,.8);
 }
 add('tail',p.tail,1.9,1,{corner:.8});
 for(let i=0;i<9;i++) {
  const u=i/9, a=p.tail[0],b=p.tail[6],tip=p.tail[4],edge=p.tail[2];
  add('tail/shaft/'+i,[[lerp(a[0],b[0],u),lerp(a[1],b[1],u)],[lerp(a[0],tip[0],.5)+u*12,lerp(a[1],tip[1],.5)-u*5],[lerp(edge[0],tip[0],u)+8,lerp(edge[1],tip[1],u)]],.7+(i%3)*.16,.65);
 }
 add('back',p.back,2,.95);add('crown',p.crown,1.9,.95);
 add('throat/edge',p.breast.slice(0,3),1.6,.8);
 add('breast/edge',p.breast.slice(2,5),1.35,.72);
 add('belly/edge',p.breast.slice(4),1.45,.8);
 // Sparse second passes are separately authored gestures, not doubled everywhere.
 add('back/search',p.back.slice(1).map(([x,y],i)=>[x-2-i*.2,y+3]),.75,.25);
 add('crown/search',p.crown.slice(1,5).map(([x,y])=>[x+1.5,y-2]),.7,.24);
 add('wing/shoulder',p.wing.slice(0,3),1.25,.7);
 // Overlapping, tapered feathers. Their tips and shafts are distinct strokes;
 // short barbs describe volume without tracing a nest of identical contours.
 const A=p.wing[1],B=p.wing[6],tips=motionPath(p.wing.slice(2,6));
 for(let i=0;i<9;i++) {
  const u=(i+.4)/9, a=[lerp(A[0],B[0],u),lerp(A[1],B[1],u)],
    b=tips.at(u).p,
    m=[lerp(a[0],b[0],.6)-3,lerp(a[1],b[1],.6)];
  add('feather/'+i,[a,m,b,[lerp(b[0],a[0],.17)+3,lerp(b[1],a[1],.17)]],1.15,.88);
  for(let j=0;j<7;j++) {
   const v=.18+j*.10,x=lerp(a[0],b[0],v)-Math.sin(v*Math.PI)*4,y=lerp(a[1],b[1],v);
   add('feather/'+i+'/barb/'+j,[[x-3,y-6],[x+1,y],[x+4,y+4]],.45+(j%3)*.16,.30+(i%3)*.08);
  }
 }
 for(let i=0;i<35;i++) {
  const u=(i+.5)/35,a=p.wing[0],b=p.wing[7],x=lerp(a[0],b[0],u),y=lerp(a[1],b[1],u);
  const reach=10+hash(i,7)*22;
  add('shoulder/down/'+i,[[x-4,y+5],[x-8,y+reach*.6],[x-3,y+reach]],.7,.28+hash(i,9)*.24);
 }
 for(let i=0;i<30;i++) {
  const u=(i+.5)/30, a=p.breast[2],b=p.breast[5],x=lerp(a[0],b[0],u),y=lerp(a[1],b[1],u);
  const jitter=(hash(i,13)-.5)*7, len=8+hash(i,8)*11;
  add('belly/'+i,[[x-5-u*14+jitter,y-len-5],[x+3-u*8+jitter,y-len*.6],[x+6-u*5+jitter,y-3]],.6+(i%4)*.14,.35+(i%3)*.08);
 }
 for(let i=0;i<46;i++) {
  const u=hash(i,29),v=hash(i,30),a=p.breast[1],b=p.breast[4],x=lerp(a[0],b[0],u)-10-v*20,y=lerp(a[1],b[1],u);
  add('breast/down/'+i,[[x-4,y-3],[x,y+3],[x+2,y+6+v*4]],.45+v*.7,.17+u*.25);
 }

 // Short facial feathers preserve the pale cheek and eye socket.
 for(let i=0;i<39;i++) {
  const u=i/39, a=p.cheek[3],b=p.cheek[5],x=lerp(a[0],b[0],u),y=lerp(a[1],b[1],u)+(hash(i,17)-.5)*6;
  add('bib/'+i,[[x,y-4],[x+2,y+3],[x+4,y+7+(1-u)*6]],.85,.42+hash(i,14)*.35);
 }
 for(let i=0;i<17;i++) {
  const u=i/17,a=p.crown[1],b=p.crown[4],x=lerp(a[0],b[0],u),y=lerp(a[1],b[1],u)-Math.sin(u*Math.PI)*15;
  add('cap/'+i,[[x-2,y+3],[x+1,y+8+hash(i,21)*4],[x+6,y+9]],.75,.35);
 }
 for(let i=0;i<40;i++) {
  const u=hash(i,41),v=hash(i,42),a=p.crown[1],b=p.crown[4],x=lerp(a[0],b[0],u),y=lerp(a[1],b[1],u)-Math.sin(u*Math.PI)*12+v*14;
  add('cap/down/'+i,[[x,y],[x+5,y+4],[x+10,y+6]],.6,.22+v*.12);
 }

 add('beak/seam',[p.beak[0].map((v,j)=>v+(j?11:1)),p.beak[1]],.9,.9);
 add('eye',p.eye,2.1,1);
 const e=p.eye,ex=e.slice(0,5).reduce((a,q)=>a+q[0],0)/5+.7,ey=e.slice(0,5).reduce((a,q)=>a+q[1],0)/5;
 for(let i=0;i<4;i++){
  const r=2.5-i*.6;
  add('pupil/'+i,[[ex-r,ey],[ex,ey-r],[ex+r,ey],[ex,ey+r],[ex-r,ey]],1.2,1,{pressure:[[0,1],[1,1]]});

const D={}, entries=[], placements={};
const put=(id,cel,frames,x=0,y=0)=>{D[id]=compileCel(cel,{id});placements[id]=[x,y];entries.push({id,frames});};
const keyRaw=Object.fromEntries(Object.entries(K).map(([id,p])=>[id,raw(p)]));
put('rest',keyRaw.rest,16);
function passage(a,b,spacing,frames=2,from=[0,0],to=from) {
 for(const [i,u] of spacing.entries()) {
  const id=a+'-'+b+'-'+i;
  put(id,inbetweenCel(keyRaw[a],keyRaw[b],u),frames,lerp(from[0],to[0],u),lerp(from[1],to[1],u));
 }
}
passage('rest','listen',[.16,.48,.82]);put('listen',keyRaw.listen,12);
passage('listen','lean',[.15,.43,.72,.92]);put('lean',keyRaw.lean,8);
passage('lean','crouch',[.12,.36,.65,.86]);put('crouch',keyRaw.crouch,3);
passage('crouch','push',[.30,.75],1);put('push',keyRaw.push,1);
// During flight the drawing spacing follows a short arc. Root placement is part
// of each exposed drawing; there is no continuous slide under a held pose.
passage('push','air',[.35,.7],1,[0,0],[42,-48]);put('air',keyRaw.air,2,42,-48);
passage('air','reach',[.25,.55,.80],2,[42,-48],[100,-10]);put('reach',keyRaw.reach,1,100,-10);
passage('reach','land',[.55],1,[100,-10],[118,0]);put('land',keyRaw.land,3,118,0);
passage('land','settle',[.13,.40,.7,.90],2,[118,0]);put('settle',keyRaw.settle,6,118,0);
passage('settle','rest',[.24,.58,.86],2,[118,0]);put('rest-after',keyRaw.rest,13,118,0);
// Blink is a replacement cel: closed eyelid replaces the entire eye construction.
const blink=raw(K.rest);blink.strokes=blink.strokes.filter(s=>!s.id.startsWith('pupil/')&&s.id!=='eye');
blink.strokes.push({id:'closed-lid',points:[[55,-164],[61,-161],[67,-163],[72,-167]],width:1.8,pressure});
put('blink',blink,3,118,0);put('last',keyRaw.rest,29,118,0);
const SHEET=exposureSheet(entries,D);

const branch={strokes:[]};
function line(id,points,width,opacity=.7){branch.strokes.push({id,points,width,opacity,pressure});}
line('branch/top',[[-365,91],[-210,87],[-55,78],[90,77],[260,65],[369,31]],2.2,.85);
line('branch/base',[[-365,106],[-210,102],[-54,91],[90,89],[260,77],[372,39]],1.4,.65);
line('twig',[[-178,94],[-238,56],[-271,5],[-295,-30]],1.8,.6);
line('twig/side',[[-254,32],[-289,22],[-323,4]],.85,.45);
line('twig/right',[[224,73],[284,99],[318,105],[352,125]],1.1,.65);
line('bud',[[-294,-30],[-301,-49],[-295,-61],[-286,-52],[-288,-41],[-294,-30]],1.1,.55);
line('leaf/l',[[311,104],[317,69],[347,55],[340,82],[327,97],[311,104]],1.5,.65);
line('leaf/vein',[[315,101],[330,82],[343,61]],.8,.5);
for(let i=0;i<8;i++){const t=i/8;line('leaf/hatch/'+i,[[317+t*19,95-t*30],[326+t*13,92-t*28]],.65,.45);}
for(let i=0;i<62;i++){const x=-355+i*11.5,y=92-(x+200)*.026-(x>200?(x-200)*.24:0);line('bark/'+i,[[x,y],[x+9,y-.8],[x+14,y-2.5]],.55+(i%5)*.11,.24+(i%3)*.09);}
const BRANCH=compileCel(branch,{id:'unchanging-branch'});
// Render a finite set of drawing cels once per output scale. No frame-number
// seeds, random paper shake, camera noise or endless re-hatching during holds.
const sprites=new Map();
function sprite(id){
 const cacheKey=LOOK+'/'+S+'/'+id;
 if(!sprites.has(cacheKey)){
  const canvas=document.createElement('canvas');canvas.width=Math.ceil(800*S*1.9);canvas.height=Math.ceil(550*S*1.9);
  const g=canvas.getContext('2d');g.scale(S*1.9,S*1.9);g.translate(370,330);
  drawCel(g,id==='branch'?BRANCH:D[id],{material:LOOK,color:LOOK==='pencil'?'#423930':'#302c29'});
  sprites.set(cacheKey,canvas);
 }
 return sprites.get(cacheKey);
}
function shot(c,t){
 paper(c,'#f5f0e5',null,87);
 const q=SHEET.at(t), [x,y]=placements[q.id];
 c.save();c.translate(CX-25,CY+178);
 const draw=(id,dx=0,dy=0)=>{const s=sprite(id);c.drawImage(s,dx-370*1.9,dy-330*1.9,s.width/S,s.height/S);};
 draw('branch');draw(q.id,x*1.9,y*1.9);c.restore();
}
defineFilm({palette:{...PALETTES.pencilMinimal,paper:'#f5f0e5'},format:{ar:'16:9',width:1920},fps:24,timeline:[{name:'a-small-decision',dur:SHEET.duration,fn:shot}]});
