<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101A22">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<!-- GAME-START -->
<title>最后一班船</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
  :root{
    --night:#101a22; --deep:#24384a; --mist:#9fb0bb; --mist-dim:#6d818e;
    --lamp:#f2c46b; --lamp-soft:#f7dda6; --rust:#b4553f;
    --paper:#e7ddc6; --paper-edge:#d3c7ab; --ink:#2a2822; --ink-soft:#5d5647;
    --ui-line:rgba(231,221,198,.28);
    --ui-glass:rgba(16,26,34,.62);
    --serif:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
    --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--night);color:var(--paper);
    font-family:var(--sans);overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #stage{position:fixed;inset:0;background:var(--night)}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #hud > *{pointer-events:auto}

  #place{position:absolute;left:calc(var(--sal) + 14px);top:calc(var(--sat) + 12px);pointer-events:none;
    max-width:56vw}
  #place .where{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mist);
    font-weight:400;text-shadow:0 1px 6px rgba(0,0,0,.65)}
  #place .goal{margin-top:5px;font-family:var(--serif);font-size:14px;line-height:1.45;color:var(--paper);
    opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.8)}

  #tools{position:absolute;right:calc(var(--sar) + 12px);top:calc(var(--sat) + 10px);
    display:flex;flex-direction:column;gap:9px;align-items:flex-end}
  .tool{width:46px;height:46px;min-width:46px;min-height:46px;border-radius:50%;
    border:1px solid var(--ui-line);background:var(--ui-glass);backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);color:var(--paper);display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-size:11px;line-height:1;letter-spacing:.04em;padding:0;cursor:pointer;
    transition:transform .14s ease,border-color .2s ease,background .2s ease}
  .tool:active{transform:scale(.92);background:rgba(36,56,74,.8)}
  .tool.off{color:var(--mist-dim);border-color:rgba(231,221,198,.14)}
  .tool .glyph{font-size:17px;line-height:1}
  .tool.pip::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--lamp);
    transform:translate(16px,-14px);box-shadow:0 0 8px var(--lamp)}
  .tool{position:relative}

  #carry{position:absolute;left:calc(var(--sal) + 14px);bottom:calc(var(--sab) + 14px);
    display:none;align-items:center;gap:9px;padding:8px 14px 8px 10px;border-radius:26px;
    border:1px solid rgba(242,196,107,.35);background:rgba(16,26,34,.7);backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);font-size:13px;letter-spacing:.05em;color:var(--lamp-soft)}
  #carry.on{display:flex}
  #carry .dot{width:10px;height:10px;border-radius:50%;background:var(--lamp);
    box-shadow:0 0 12px 2px rgba(242,196,107,.75);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  #toast{position:absolute;left:50%;bottom:calc(var(--sab) + 88px);transform:translateX(-50%) translateY(10px);
    max-width:min(84vw,380px);padding:11px 18px;border-radius:14px;background:rgba(12,20,27,.94);
    border:1px solid var(--ui-line);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    font-family:var(--serif);font-size:14.5px;line-height:1.6;text-align:center;color:var(--paper);
    opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- sheets (paper) ---------- */
  .veil{position:fixed;inset:0;background:rgba(8,14,19,.55);opacity:0;pointer-events:none;
    transition:opacity .26s ease;z-index:34}
  .veil.on{opacity:1;pointer-events:auto}

  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:35;
    transform:translateY(103%);transition:transform .32s cubic-bezier(.22,.75,.3,1);
    display:flex;flex-direction:column;
    max-height:min(76vh,640px);
    background:var(--paper);color:var(--ink);
    border-top-left-radius:16px;border-top-right-radius:16px;
    box-shadow:0 -18px 44px rgba(0,0,0,.55);
    padding-bottom:var(--sab);
    background-image:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),
      repeating-linear-gradient(92deg,rgba(150,138,110,.055) 0 2px,rgba(150,138,110,0) 2px 7px)}
  .sheet.on{transform:translateY(0)}
  .sheet.tall{max-height:min(84vh,760px)}

  .sheet-head{flex:none;display:flex;align-items:flex-start;gap:12px;padding:16px 16px 10px 20px;
    border-bottom:1px solid var(--paper-edge)}
  .sheet-head .kind{font-size:10px;letter-spacing:.3em;color:var(--rust);text-transform:uppercase;
    font-weight:500}
  .sheet-head h2{margin:5px 0 0;font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.3;
    letter-spacing:.02em;text-wrap:balance}
  .sheet-head .grow{flex:1;min-width:0}
  .x{flex:none;width:44px;height:44px;min-width:44px;border-radius:50%;border:1px solid var(--paper-edge);
    background:rgba(255,255,255,.35);color:var(--ink-soft);font-size:19px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-top:-2px}
  .x:active{background:rgba(0,0,0,.07)}

  .sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding:16px 20px 6px;font-family:var(--serif);font-size:16px;line-height:1.85;color:var(--ink)}
  .sheet-body p{margin:0 0 .95em}
  .sheet-body p:last-child{margin-bottom:0}
  .sheet-body .quiet{color:var(--ink-soft);font-size:14.5px;line-height:1.75}
  .sheet-body .hand{font-family:var(--serif);padding-left:12px;border-left:2px solid var(--paper-edge)}
  .sheet-body .sign{text-align:right;color:var(--ink-soft)}
  .sheet-foot{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px 14px 20px;
    border-top:1px solid var(--paper-edge)}
  .dots{display:flex;gap:6px;flex:1}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--paper-edge);display:block}
  .dots i.on{background:var(--rust)}
  .btn{min-height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:14px;letter-spacing:.08em;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--paper-edge)}

  /* chart figure */
  .chart-fig{margin:0 0 14px;background:#efe7d4;border:1px solid var(--paper-edge);border-radius:8px;
    padding:8px;overflow-x:auto;touch-action:pan-x pan-y}
  .chart-fig svg{display:block;width:100%;height:auto;min-width:260px}
  figcaption{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);
    padding-top:6px;text-align:center}

  /* journal list */
  .jlist{display:flex;flex-direction:column;gap:0}
  .jitem{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;min-height:52px;
    padding:12px 4px;background:none;border:0;border-bottom:1px solid var(--paper-edge);
    font-family:var(--serif);font-size:16px;color:var(--ink);cursor:pointer}
  .jitem:active{background:rgba(0,0,0,.05)}
  .jitem .k{font-family:var(--sans);font-size:10px;letter-spacing:.22em;color:var(--rust);flex:none;width:52px}
  .jitem .n{flex:1}
  .jitem .go{color:var(--ink-soft);font-size:14px}
  .jempty{font-family:var(--serif);color:var(--ink-soft);line-height:1.9}

  /* channel chooser */
  #chan{position:fixed;left:0;right:0;bottom:0;z-index:36;transform:translateY(105%);
    transition:transform .3s cubic-bezier(.22,.75,.3,1);padding:0 12px calc(var(--sab) + 14px);
    pointer-events:none}
  #chan.on{transform:translateY(0);pointer-events:auto}
  #chan .wrap{background:rgba(16,26,34,.9);border:1px solid var(--ui-line);border-radius:18px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);padding:13px 13px 14px;
    box-shadow:0 -14px 36px rgba(0,0,0,.5)}
  #chan .cap{font-size:11px;letter-spacing:.26em;color:var(--mist);text-align:center;margin-bottom:4px}
  #chan .sub{font-family:var(--serif);font-size:13.5px;color:var(--paper);opacity:.85;text-align:center;
    margin-bottom:11px;line-height:1.6}
  #chan .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .chanbtn{min-height:74px;border-radius:13px;border:1px solid var(--ui-line);background:rgba(36,56,74,.5);
    color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-family:var(--sans);cursor:pointer;padding:8px 4px}
  .chanbtn:active{transform:scale(.96)}
  .chanbtn .cn{font-family:var(--serif);font-size:16px;letter-spacing:.06em}
  .chanbtn .mk{font-size:10.5px;letter-spacing:.02em;color:var(--mist);line-height:1.3;text-align:center}
  .chanbtn.tried{border-color:rgba(180,85,63,.6);background:rgba(180,85,63,.16)}
  .chanbtn.tried .mk{color:#e0a08c}
  #chan .aside{margin-top:10px;display:flex;gap:9px}
  #chan .aside .btn{flex:1;background:transparent;color:var(--paper);border-color:var(--ui-line);font-size:13px}

  /* ---------- full screens ---------- */
  .screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    padding:calc(var(--sat) + 26px) calc(var(--sar) + 24px) calc(var(--sab) + 26px) calc(var(--sal) + 24px);
    background:linear-gradient(178deg,#0d161d 0%,#152430 46%,#22333f 100%);
    opacity:1;transition:opacity .5s ease}
  .screen.hide{opacity:0;pointer-events:none}
  .screen .lamp-halo{position:absolute;left:50%;top:26%;width:min(78vw,330px);aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(242,196,107,.30) 0%,rgba(242,196,107,.09) 38%,rgba(242,196,107,0) 68%);
    animation:breathe 6.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.94)}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
  .screen .inner{position:relative;margin:auto 0;display:flex;flex-direction:column;gap:0;max-width:34em}
  .eyebrow{font-size:11px;letter-spacing:.42em;color:var(--mist);text-transform:uppercase}
  .screen h1{font-family:var(--serif);font-weight:600;margin:14px 0 0;
    font-size:clamp(38px,13vw,60px);line-height:1.06;letter-spacing:.06em;color:var(--paper)}
  .rule{width:52px;height:1px;background:var(--rust);margin:20px 0 18px}
  .screen .lede{font-family:var(--serif);font-size:16px;line-height:1.95;color:var(--paper);opacity:.9;
    margin:0 0 8px}
  .screen .lede em{font-style:normal;color:var(--lamp-soft)}
  .screen .lede.quiet{color:var(--mist);font-size:14px;line-height:1.85}
  .screen .meta{font-size:12px;line-height:2;letter-spacing:.06em;color:var(--mist);margin-top:16px}
  .screen .acts{margin-top:26px;display:flex;flex-direction:column;gap:11px}
  .bigbtn{min-height:54px;border-radius:27px;border:1px solid var(--lamp);background:var(--lamp);
    color:#20180a;font-family:var(--sans);font-size:16px;font-weight:500;letter-spacing:.14em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 8px 30px rgba(242,196,107,.22)}
  .bigbtn:active{transform:scale(.98)}
  .bigbtn.quiet{background:transparent;color:var(--paper);border-color:var(--ui-line);box-shadow:none;
    font-weight:400;letter-spacing:.1em}
  .qrow{display:flex;gap:10px;margin-top:2px}
  .qrow .bigbtn{flex:1;min-height:48px;font-size:14px}

  /* ---------- cinematic ---------- */
  #cine{position:fixed;inset:0;z-index:18;pointer-events:none;opacity:0;transition:opacity .5s ease}
  #cine.on{opacity:1;pointer-events:auto}
  #cine .bar{position:absolute;left:0;right:0;height:7vh;background:#080d12;transition:height .6s ease}
  #cine .bar.t{top:0}#cine .bar.b{bottom:0}
  #cine .line{position:absolute;left:0;right:0;bottom:calc(7vh + var(--sab) + 26px);
    padding:0 calc(var(--sal) + 26px) 0 calc(var(--sar) + 26px);text-align:center}
  #cine .line span{display:inline-block;font-family:var(--serif);font-size:17px;line-height:1.85;
    color:var(--paper);text-shadow:0 2px 14px rgba(0,0,0,.95);max-width:26em;
    opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease}
  #cine .line span.on{opacity:1;transform:translateY(0)}
  #cine .tapon{position:absolute;right:calc(var(--sar) + 22px);bottom:calc(7vh + var(--sab) + 8px);
    font-size:11px;letter-spacing:.2em;color:var(--mist);opacity:.7}

  #fade{position:fixed;inset:0;z-index:40;background:#081016;opacity:0;pointer-events:none;
    transition:opacity .34s ease}
  #fade.on{opacity:1}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.08s !important}
  }
  @media (max-height:620px){
    .screen h1{font-size:clamp(30px,10vw,44px)}
    .screen .lede{font-size:14.5px;line-height:1.8}
    .sheet-body{font-size:15px;line-height:1.75}
  }
</style>

<div id="stage"></div>

<div id="hud" aria-hidden="false">
  <div id="place">
    <div class="where" id="whereTxt">码头</div>
    <div class="goal" id="goalTxt">天黑以前，把灯点起来。</div>
  </div>
  <div id="tools">
    <button class="tool" id="btnJournal" type="button" aria-label="线索手帐"><span class="glyph">☰</span></button>
    <button class="tool" id="btnHint" type="button" aria-label="提示"><span class="glyph">?</span></button>
    <button class="tool" id="btnSound" type="button" aria-label="声音"><span class="glyph">♪</span></button>
    <button class="tool" id="btnMenu" type="button" aria-label="设置"><span class="glyph">⋯</span></button>
  </div>
  <div id="carry"><span class="dot"></span><span id="carryTxt">备用灯具</span></div>
  <div id="toast"></div>
</div>

<div class="veil" id="veil"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <div class="grow">
      <div class="kind" id="sheetKind">纸条</div>
      <h2 id="sheetTitle">标题</h2>
    </div>
    <button class="x" id="sheetX" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot">
    <div class="dots" id="sheetDots"></div>
    <button class="btn ghost" id="sheetPrev" type="button">上一页</button>
    <button class="btn" id="sheetNext" type="button">继续</button>
  </div>
</div>

<div id="chan">
  <div class="wrap">
    <div class="cap">灯 罩 朝 向</div>
    <div class="sub" id="chanSub">照亮哪一条水道？（左为西，右为东）</div>
    <div class="row">
      <button class="chanbtn" data-ch="w" type="button"><span class="cn">西水道</span><span class="mk">贴着三块白礁</span></button>
      <button class="chanbtn" data-ch="c" type="button"><span class="cn">中水道</span><span class="mk">看着最宽</span></button>
      <button class="chanbtn" data-ch="e" type="button"><span class="cn">东水道</span><span class="mk">经过红浮标</span></button>
    </div>
    <div class="aside">
      <button class="btn ghost" id="chanChart" type="button">看海图</button>
      <button class="btn ghost" id="chanClose" type="button">先不照</button>
    </div>
  </div>
</div>

<div id="cine">
  <div class="bar t"></div><div class="bar b"></div>
  <div class="line"><span id="cineTxt"></span></div>
  <div class="tapon">轻点继续</div>
</div>

<div id="fade"></div>

<div class="screen" id="startScreen">
  <div class="lamp-halo"></div>
  <div class="inner">
    <div class="eyebrow">北屿 · 傍晚 · 有雾</div>
    <h1>最后一班船</h1>
    <div class="rule"></div>
    <p class="lede">渡轮把你放在栈桥尽头就走了。岛上没有人应门，灯塔是黑的。<br>
      木桩上别着一张纸条，字迹被雾洇开：</p>
    <p class="lede"><em>「今晚还有一班船。天黑以前，请把灯点起来。」</em></p>
    <p class="lede">远处传来一声汽笛。</p>
    <div class="meta">全程单指轻点 · 约 5–8 分钟 · 没有倒计时，可以慢慢走</div>
    <div class="acts">
      <button class="bigbtn" id="btnStart" type="button">开 始</button>
      <div class="qrow">
        <button class="bigbtn quiet" id="btnQualStart" type="button">画质：高</button>
        <button class="bigbtn quiet" id="btnSoundStart" type="button">声音：开</button>
      </div>
    </div>
  </div>
</div>

<div class="screen hide" id="endScreen">
  <div class="lamp-halo"></div>
  <div class="inner">
    <div class="eyebrow">尾 声</div>
    <h1>灯还亮着</h1>
    <div class="rule"></div>
    <p class="lede">最后一班船靠了岸。<br>缆桩上多了一枚贝壳，塔顶的光比从前转得慢一点。</p>
    <p class="lede quiet" id="endStat"></p>
    <div class="acts">
      <button class="bigbtn quiet" id="btnEndJournal" type="button">翻看线索手帐</button>
      <button class="bigbtn" id="btnRestart" type="button">重 新 开 始</button>
    </div>
  </div>
</div>

<div class="screen hide" id="menuScreen">
  <div class="inner">
    <div class="eyebrow">暂 停</div>
    <h1>歇一会儿</h1>
    <div class="rule"></div>
    <p class="lede quiet">灯塔不会自己灭。海上那班船也会等。</p>
    <div class="acts">
      <div class="qrow">
        <button class="bigbtn quiet" id="btnQual" type="button">画质：高</button>
        <button class="bigbtn quiet" id="btnSound2" type="button">声音：开</button>
      </div>
      <button class="bigbtn quiet" id="btnHowto" type="button">怎么玩</button>
      <button class="bigbtn quiet" id="btnRestart2" type="button">从头再来</button>
      <button class="bigbtn" id="btnResume" type="button">继 续</button>
    </div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   《最后一班船》 The Last Ship
   A touch-only 3D narrative exploration piece for phone browsers.
   Built on three.js (vendored, MIT).
   ============================================================ */

/* ---------- tiny helpers ---------- */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rand = (() => { let s = 20261007; return () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff; })();
const rr = (a, b) => a + (b - a) * rand();

/* make sure pinch-zoom / safe-area behave even when the host page owns <head> */
(function fixViewport() {
  let m = document.querySelector('meta[name="viewport"]');
  if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
  m.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
})();
document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

/* ============================================================
   1. THE ISLAND — a single source of truth for geography
   ============================================================ */
const GEO = {

function landMask(x, z) {
  const e1 = 1 - ((x) / 19.5) ** 2 - ((z - 2) / 22) ** 2;
  const e2 = 1 - ((x - 7) / 9.5) ** 2 - ((z + 21) / 8.5) ** 2;
  const e3 = 1 - ((x + 13) / 8.5) ** 2 - ((z - 4) / 8.5) ** 2;
  return Math.max(e1, e2, e3);
}
function terrainH(x, z) {
  const m = landMask(x, z);
  let h = -1.7 + 2.75 * smoothstep(-0.34, 0.26, m);
  // lighthouse headland
  const dl = Math.hypot(x - GEO.tower.x, z - GEO.tower.z);
  h += 2.55 * Math.exp(-(dl * dl) / 90);
  // gentle rise behind the cottage
  const dc = Math.hypot(x + 16.5, z + 6);
  h += 1.15 * Math.exp(-(dc * dc) / 70);
  // texture
  h += 0.17 * Math.sin(x * 0.62) * Math.cos(z * 0.51) + 0.11 * Math.sin(x * 0.29 + z * 0.44);
  // flat pad under the tower
  const pad = smoothstep(7.6, 4.4, dl);
  h = lerp(h, 3.30, pad);
  // flat pad under the cottage
  const cx = Math.abs(x - GEO.cottage.x) - GEO.cottage.w / 2 - 1.6;
  const cz = Math.abs(z - GEO.cottage.z) - GEO.cottage.d / 2 - 1.6;
  const cpad = smoothstep(1.6, -0.6, Math.max(cx, cz));
  h = lerp(h, GEO.cottage.floorY - 0.12, cpad);
  return h;
}

  const mat = new THREE.ShaderMaterial({

      uniform float uTime; varying float vH; varying vec3 vW;

      uniform vec3 uDeep,uMid,uCrest,uLamp,uSpot; uniform float uSpotI;

/* ---------- path on the ground (also used for the dirt colouring) ---------- */
const PATH = [
  [[0, 15.2], [0.6, 10.5], [0.9, 6.6]],
  [[0.9, 6.6], [-1.6, 4.6], [-4.4, 3.1], [-6.5, 2.6]],
  [[0.9, 6.6], [2.6, 1.0], [4.0, -7.0], [5.4, -13.5], [6.0, -16.4]]
];
function distToPath(x, z) {
  let best = 1e9;
  for (const line of PATH) {
    for (let i = 0; i < line.length - 1; i++) {
      const ax = line[i][0], az = line[i][1], bx = line[i + 1][0], bz = line[i + 1][1];
      const dx = bx - ax, dz = bz - az;
      const t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
      best = Math.min(best, Math.hypot(x - (ax + dx * t), z - (az + dz * t)));
    }
  }
  return best;
}

(function buildLand() {
  const SZ = 86, SEG = 86;
  const g = new THREE.PlaneGeometry(SZ, SZ, SEG, SEG);
  g.rotateX(-Math.PI / 2);
  g.translate(0, 0, -3);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const cGrass = new THREE.Color(0x4c5a46), cGrass2 = new THREE.Color(0x596648);
  const cSand = new THREE.Color(0x85795f), cRock = new THREE.Color(0x646a71), cDirt = new THREE.Color(0x6f6653);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let h = terrainH(x, z);
    const edge = Math.max(Math.abs(x) / (SZ / 2), Math.abs(z + 3) / (SZ / 2));
    h -= 6 * smoothstep(0.78, 1.0, edge);
    pos.setY(i, h);
    const dl = Math.hypot(x - GEO.tower.x, z - GEO.tower.z);
    tmp.copy(cGrass).lerp(cGrass2, 0.5 + 0.5 * Math.sin(x * 0.4 + z * 0.33));
    if (h < 0.62) tmp.lerp(cSand, smoothstep(0.62, 0.05, h));
    if (dl < 9.5 && h > 2.3) tmp.lerp(cRock, smoothstep(9.5, 5.0, dl) * 0.85);
    const dp = distToPath(x, z);
    if (dp < 1.5 && h > 0.7) tmp.lerp(cDirt, smoothstep(1.5, 0.5, dp) * 0.85);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const land = new THREE.Mesh(g, M.land);
  land.userData.gArea = 'isle';
  scene.add(land);
  groundPick.push(land);
})();

(function buildPier() {

  const y = GEO.pierDeckY, z0 = GEO.pierStart.z, z1 = GEO.pierEnd.z;
  const deck = mesh(box(3.4, 0.22, z1 - z0), M.wood2, 0, y, (z0 + z1) / 2, g);
  deck.userData.gArea = 'isle';
  groundPick.push(deck);
  // plank lines
  for (let z = z0 + 0.9; z < z1; z += 1.35) mesh(box(3.44, 0.05, 0.08), M.wood, 0, y + 0.12, z, g);

/* ============================================================
   6. WALKING — grids, A*, and a body to move around
   ============================================================ */
function Grid(x0, z0, x1, z1, cell, walk) {
  this.x0 = x0; this.z0 = z0; this.cell = cell;
  this.w = Math.max(1, Math.ceil((x1 - x0) / cell));
  this.h = Math.max(1, Math.ceil((z1 - z0) / cell));
  const raw = new Uint8Array(this.w * this.h);
  for (let j = 0; j < this.h; j++) for (let i = 0; i < this.w; i++) {
    raw[j * this.w + i] = walk(x0 + (i + 0.5) * cell, z0 + (j + 0.5) * cell) ? 1 : 0;
  }
  // erode by one cell so the body keeps clear of walls and cliffs
  this.ok = new Uint8Array(this.w * this.h);
  for (let j = 0; j < this.h; j++) for (let i = 0; i < this.w; i++) {
    let good = raw[j * this.w + i] === 1;
    if (good) {
      for (let dj = -1; dj <= 1 && good; dj++) for (let di = -1; di <= 1; di++) {
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= this.w || nj >= this.h || !raw[nj * this.w + ni]) { good = false; break; }
      }
    }
    this.ok[j * this.w + i] = good ? 1 : 0;
  }
}
Grid.prototype.ci = function (x) { return Math.floor((x - this.x0) / this.cell); };
Grid.prototype.cj = function (z) { return Math.floor((z - this.z0) / this.cell); };
Grid.prototype.cx = function (i) { return this.x0 + (i + 0.5) * this.cell; };
Grid.prototype.cz = function (j) { return this.z0 + (j + 0.5) * this.cell; };
Grid.prototype.free = function (i, j) {
  return i >= 0 && j >= 0 && i < this.w && j < this.h && this.ok[j * this.w + i] === 1;
};
Grid.prototype.freeAt = function (x, z) { return this.free(this.ci(x), this.cj(z)); };
Grid.prototype.nearest = function (x, z, maxCells) {
  let i = this.ci(x), j = this.cj(z);
  if (this.free(i, j)) return [i, j];
  for (let r = 1; r <= (maxCells || 14); r++) {
    let best = null, bd = 1e9;
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
      if (Math.max(Math.abs(di), Math.abs(dj)) !== r) continue;
      const ni = i + di, nj = j + dj;
      if (!this.free(ni, nj)) continue;
      const d = (this.cx(ni) - x) ** 2 + (this.cz(nj) - z) ** 2;
      if (d < bd) { bd = d; best = [ni, nj]; }
    }
    if (best) return best;
  }

};
Grid.prototype.los = function (ax, az, bx, bz) {
  const d = Math.hypot(bx - ax, bz - az), n = Math.max(2, Math.ceil(d / (this.cell * 0.5)));

  }

};

  const S0 = this.nearest(sx, sz), T0 = this.nearest(tx, tz);

  const si = S0[0], sj = S0[1], ti = T0[0], tj = T0[1];
  if (si === ti && sj === tj) return [[this.cx(ti), this.cz(tj)]];
  const g = new Float32Array(N).fill(Infinity);
  const f = new Float32Array(N).fill(Infinity);
  const prev = new Int32Array(N).fill(-1);
  const closed = new Uint8Array(N);
  const heap = []; // [f, idx]
  const push = (v) => { heap.push(v); let c = heap.length - 1; while (c > 0) { const p = (c - 1) >> 1; if (heap[p][0] <= heap[c][0]) break; const t = heap[p]; heap[p] = heap[c]; heap[c] = t; c = p; } };

    const top = heap[0], last = heap.pop();
    if (heap.length) { heap[0] = last; let c = 0; for (;;) { const l = c * 2 + 1, r = l + 1; let m = c; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === c) break; const t = heap[m]; heap[m] = heap[c]; heap[c] = t; c = m; } }
    return top;

  while (heap.length && guard++ < 40000) {
    const cur = pop()[1];
    if (closed[cur]) continue;
    closed[cur] = 1;
    const ci = cur % W, cj2 = (cur - ci) / W;
    if (ci === ti && cj2 === tj) { found = cur; break; }
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const ni = ci + di, nj = cj2 + dj;
      if (!this.free(ni, nj)) continue;
      if (di && dj && (!this.free(ci + di, cj2) || !this.free(ci, cj2 + dj))) continue;
      const nk = nj * W + ni;
      if (closed[nk]) continue;
      const step = (di && dj) ? 1.414 : 1;
      const ng = g[cur] + step;
      if (ng < g[nk]) { g[nk] = ng; f[nk] = ng + hcost(ni, nj) * 1.02; prev[nk] = cur; push([f[nk], nk]); }
    }
  }
  if (found < 0) return null;
  const cells = [];
  for (let k = found; k !== -1; k = prev[k]) { const i = k % W; cells.push([this.cx(i), this.cz((k - i) / W)]); }
  cells.reverse();
  // string-pull
  const out = [];
  let a = 0;
  while (a < cells.length - 1) {
    let b = cells.length - 1;
    while (b > a + 1 && !this.los(cells[a][0], cells[a][1], cells[b][0], cells[b][1])) b--;
    out.push(cells[b]); a = b;
  }
  if (!out.length) out.push(cells[cells.length - 1]);
  return out;
};

      walker.idx++;
      if (walker.idx >= walker.route.length) {
        walker.route = []; walker.moving = false;
        const cb = walker.onArrive; walker.onArrive = null;
        if (cb) cb();
      }
    } else {
      walker.pos.x += (dx / d) * step;
      walker.pos.z += (dz / d) * step;
      const want = Math.atan2(dx, dz);
      let diff = ((want - walker.yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      walker.yaw += diff * Math.min(1, dt * 9);
      walker.phase += step * 3.4;
    }
  } else {
    walker.phase += dt * 0.7;
  }
  walker.pos.y = groundY(walker.pos.x, walker.pos.z);
  player.position.set(walker.pos.x, walker.pos.y + (walker.moving ? Math.abs(Math.sin(walker.phase)) * 0.05 : 0), walker.pos.z);
  player.rotation.y = walker.yaw;
  const sw = walker.moving ? Math.sin(walker.phase) * 0.55 : Math.sin(walker.phase * 0.6) * 0.03;
  player.userData.legs[0].rotation.x = sw;
  player.userData.legs[1].rotation.x = -sw;
  pShadow.position.set(walker.pos.x, walker.pos.y + 0.03, walker.pos.z);
  pShadow.visible = S.area !== 'lamp';
}

const ray = new THREE.Raycaster();

function screenOf(v3) {
  projV.copy(v3).project(camera);

  return {
    x: r.left + (projV.x * 0.5 + 0.5) * r.width,

function faceTowards(x, z) {

function trigger(it) {

}
function approach(it) {
  const d = Math.hypot(walker.pos.x - it.stand[0], walker.pos.z - it.stand[1]);
  if (d < 1.0) { trigger(it); return; }
  showMarker(it.stand[0], it.stand[1]);
  if (!walkTo(it.stand[0], it.stand[1], () => trigger(it))) {
    if (d < 4.0) trigger(it); else toast('从这儿过不去，换条路走走看。');

function showMarker(x, z) {

  markerT = 0.85;

function handleTap(px, py) {
  if (!S.started || S.paused || S.cinematic || fading) return;
  if (performance.now() < S.inputLockUntil) return;
  const r = renderer.domElement.getBoundingClientRect();
  // 1) something to look at?
  let best = null, bestD = 1e9;
  for (const it of INTER) {
    if (!interAvailable(it)) continue;
    const sp = screenOf(it.p);
    if (!sp.front) continue;
    const d = Math.hypot(sp.x - px, sp.y - py);
    if (d < 48 && d < bestD) { bestD = d; best = it; }
  }
  if (best) { approach(best); return; }
  // 2) otherwise, walk
  ndc.x = ((px - r.left) / r.width) * 2 - 1;
  ndc.y = -((py - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const targets = groundPick.filter(m => m.userData.gArea === S.area);
  const hits = ray.intersectObjects(targets, false);
  if (!hits.length) return;
  const p = hits[0].point;
  const g = areaGrid();
  const cell = g.nearest(p.x, p.z, 6);
  if (!cell) { return; }
  const gx = g.cx(cell[0]), gz = g.cz(cell[1]);
  if (Math.hypot(gx - p.x, gz - p.z) > 3.2) return;
  showMarker(gx, gz);

}

let AC = null, master = null, surfGain = null;
function initAudio() {
  if (AC) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try { AC = new Ctx(); } catch (e) { AC = null; return; }
  master = AC.createGain();
  master.gain.value = S.sound ? 0.75 : 0;
  master.connect(AC.destination);
  // surf: filtered noise with a slow swell
  const len = AC.sampleRate * 4;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const dch = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.028 * w) / 1.028;
    dch[i] = last * 3.2;
  }
  const src = AC.createBufferSource();
  src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 520;
  surfGain = AC.createGain(); surfGain.gain.value = 0.5;
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.11;
  const lfoG = AC.createGain(); lfoG.gain.value = 0.26;
  lfo.connect(lfoG); lfoG.connect(surfGain.gain);
  src.connect(lp); lp.connect(surfGain); surfGain.connect(master);
  src.start(); lfo.start();
  // wind
  const src2 = AC.createBufferSource();
  src2.buffer = buf; src2.loop = true;
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.7;
  const wg = AC.createGain(); wg.gain.value = 0.09;
  src2.connect(bp); bp.connect(wg); wg.connect(master);
  src2.start();
}
function tone(freq, dur, type, vol, glideTo) {
  if (!AC || !master) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, AC.currentTime + dur * 0.9);
  g.gain.setValueAtTime(0.0001, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.14, AC.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g); g.connect(master);
  o.start(); o.stop(AC.currentTime + dur + 0.05);
}
function noiseBurst(freq, dur, vol) {
  if (!AC || !master) return;
  const len = Math.ceil(AC.sampleRate * dur);
  const b = AC.createBuffer(1, len, AC.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s2 = AC.createBufferSource(); s2.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.4;
  const g = AC.createGain(); g.gain.value = vol || 0.2;
  s2.connect(f); f.connect(g); g.connect(master);
  s2.start();
}
function sfx(name) {
  if (!AC) return;
  switch (name) {
    case 'found': tone(587, 0.5, 'sine', 0.09); tone(880, 0.42, 'sine', 0.05); break;
    case 'pick': tone(784, 0.32, 'triangle', 0.10); break;
    case 'door': noiseBurst(220, 0.34, 0.14); break;
    case 'turn': noiseBurst(1400, 0.09, 0.10); setTimeout(() => noiseBurst(900, 0.07, 0.07), 90); break;
    case 'light': tone(196, 1.1, 'sine', 0.10, 392); tone(587, 1.4, 'sine', 0.045); break;
    case 'shell': tone(1046, 0.45, 'sine', 0.07); break;
    case 'horn': {
      if (!AC || !master) break;
      const t0 = AC.currentTime, g = AC.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.20, t0 + 0.20);
      g.gain.setValueAtTime(0.20, t0 + 1.15);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.9);
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 780;
      for (const f of [104, 156.4, 208.8]) {
        const o = AC.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = f;
        o.connect(lp);
        o.start(t0); o.stop(t0 + 2.0);
      }
      lp.connect(g); g.connect(master);
      break;
    }
  }
}

  S.sound = on;

const SHIP_ROUTE = [[29.8, -71.8], [24, -56], [16.8, -42], [13.5, -26], [12.5, -8], [12, 10], [10.5, 22], [7.5, 30], [4.6, 31], [3.3, 24.6]];
const SHIP_LEN = (() => {
  const acc = [0];
  for (let i = 1; i < SHIP_ROUTE.length; i++) {
    acc.push(acc[i - 1] + Math.hypot(SHIP_ROUTE[i][0] - SHIP_ROUTE[i - 1][0], SHIP_ROUTE[i][1] - SHIP_ROUTE[i - 1][1]));
  }
  return acc;
})();
function shipAt(u) {
  const total = SHIP_LEN[SHIP_LEN.length - 1];
  const d = clamp(u, 0, 1) * total;
  let i = 1;
  while (i < SHIP_LEN.length - 1 && SHIP_LEN[i] < d) i++;
  const t = (d - SHIP_LEN[i - 1]) / Math.max(0.001, SHIP_LEN[i] - SHIP_LEN[i - 1]);
  const a = SHIP_ROUTE[i - 1], b = SHIP_ROUTE[i];
  const x = lerp(a[0], b[0], t), z = lerp(a[1], b[1], t);
  return { x, z, yaw: Math.atan2(-(b[0] - a[0]), -(b[1] - a[1])) };
}

  OBJ.beam.visible = false;
  OBJ.beamSpot.visible = false;
  lampLight.intensity = 0;
  if (seaUni) seaUni.uSpotI.value = 0;
  OBJ.ship.position.set(GEO.shipStart.x, 0, GEO.shipStart.z);
  OBJ.ship.rotation.y = shipAt(0).yaw;
  OBJ.plank.visible = false;
  OBJ.passenger.visible = false;
  OBJ.shipLight.visible = true; OBJ.shipHalo.visible = true;
  if (shellProp) shellProp.visible = false;
  beamSweep = false;
  beamYaw = beamYawT = 0;
  camMode = 'area'; camChannel = null; cineCam = null;
  el.cine.classList.remove('on');
  $('hud').style.display = '';
  el.chan.classList.remove('on');
  closeSheet();
  applyAreaVisuals();
  placeWalker(GEO.spawn.x, GEO.spawn.z, Math.PI);
  camSnap = true;
  refreshHUD();
}
function beginGame() {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  resetWorld();
  S.started = true;
  hideScreens();
  camSnap = true;
  updateCamera(0);
  setTimeout(() => toast('轻点地面走过去，轻点物件看一看。', 3600), 700);
}
function setQuality(q) {
  S.quality = q;
  const t = q === 'high' ? '画质：高' : '画质：省电';
  $('btnQual').textContent = t;
  $('btnQualStart').textContent = t;
  buildSea(); buildFlora(); buildMist();
  applyAreaVisuals();
  resize();
}

$('btnStart').addEventListener('click', beginGame);
$('btnRestart').addEventListener('click', () => { resetWorld(); showScreen('startScreen'); S.started = false; });
$('btnRestart2').addEventListener('click', () => { resetWorld(); showScreen('startScreen'); S.started = false; });
$('btnResume').addEventListener('click', () => { hideScreens(); });
$('btnEndJournal').addEventListener('click', () => { openJournal(); });
$('btnJournal').addEventListener('click', () => { if (!S.cinematic) openJournal(); });
$('btnHint').addEventListener('click', () => { if (!S.cinematic && !sheetOpen) giveHint(); });
$('btnSound').addEventListener('click', () => { initAudio(); if (AC && AC.state === 'suspended') AC.resume(); setSound(!S.sound); });
$('btnSoundStart').addEventListener('click', () => { setSound(!S.sound); });
$('btnSound2').addEventListener('click', () => { initAudio(); setSound(!S.sound); });
$('btnQual').addEventListener('click', () => setQuality(S.quality === 'high' ? 'low' : 'high'));
$('btnQualStart').addEventListener('click', () => setQuality(S.quality === 'high' ? 'low' : 'high'));
$('btnMenu').addEventListener('click', () => { if (!S.cinematic) showScreen('menuScreen'); });
$('btnHowto').addEventListener('click', () => {
  hideScreens();
  openSheet('说明', '怎么玩', [
    `<p><b>走路</b>　轻点地面，人会自己绕开房子和石头走过去。</p>
     <p><b>查看</b>　轻点看得见的物件（有小光点的），人会走近再看。</p>
     <p><b>手帐</b>　右上角 ☰，读过的纸条、日志、信和海图都在里面，随时能翻。</p>
     <p><b>提示</b>　右上角 ?，点一次给方向，再点一次给具体位置。</p>
     <p class="quiet">没有倒计时，选错水道也不会失败，可以一直重来。</p>`
  ]);
});

/* ---------- the frame ---------- */
let last = performance.now(), acc = 0, frames = 0, autoDropChecked = false;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  const t = now * 0.001;

  if (seaUni) { seaUni.uTime.value = t; }
  for (const m of swayMats) m.userData.t.value = t;

  if (S.cinematic) updateEnding(dt);
  if (S.started && !S.paused) updateWalker(dt);
  else updateWalker(0);

  // beam
  if (OBJ.beam.visible) {
    if (beamSweep) beamYawT += dt * 0.16;
    let diff = ((beamYawT - beamYaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    beamYaw += diff * Math.min(1, dt * 1.5);
    OBJ.beam.rotation.order = 'YXZ';
    OBJ.beam.rotation.y = beamYaw;
    OBJ.beam.rotation.x = -0.1;
    const dx = -Math.sin(beamYaw), dz = -Math.cos(beamYaw);
    const L = 34;
    OBJ.beamSpot.position.set(T.x + dx * L, 0.07, T.z + dz * L);
    if (seaUni) {
      seaUni.uSpot.value.set(T.x + dx * L, 0, T.z + dz * L);
      seaUni.uSpotI.value = 0.85 + 0.1 * Math.sin(t * 2.1);
    }
    OBJ.bulb.material.color.setHSL(0.11, 0.85, 0.62 + 0.05 * Math.sin(t * 3));
    lampLight.intensity = 1.4 + 0.15 * Math.sin(t * 2.3);
  }

  // markers
  for (const m of markers) {
    const on = interAvailable(m.userData.it) && !S.cinematic;
    m.visible = on;
    if (!on) continue;
    m.position.y = m.userData.base + Math.sin(t * 1.9 + m.position.x) * 0.09;
    m.rotation.y = t * 0.9;
    m.material.opacity = 0.55 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2.4 + m.position.z));
  }
  if (arrow.visible) {
    if (now > arrowUntil) arrow.visible = false;
    else arrow.position.y = (arrow.userData.base || 2) + Math.sin(t * 3.4) * 0.16;
  }
  if (markerT > 0) {
    markerT -= dt;
    marker.material.opacity = Math.max(0, markerT);
    marker.scale.setScalar(1 + (0.85 - markerT) * 0.5);
    if (markerT <= 0) marker.material.opacity = 0;
  }

  // little life
  if (OBJ.buoys) OBJ.buoys.forEach((b, i) => {
    b.rotation.z = Math.sin(t * 0.9 + b.userData.bob) * 0.12;
    b.position.y = Math.sin(t * 0.75 + b.userData.bob) * 0.16;
  });
  if (OBJ.buoyLights) {
    const on = (t % 3) < 0.35;
    OBJ.buoyLights.forEach(l => l.visible = on);
  }
  OBJ.ship.position.y = Math.sin(t * 0.7) * 0.16;
  OBJ.shipHull.rotation.z = Math.sin(t * 0.62) * 0.035;
  if (OBJ.fire) OBJ.fire.material.color.setHSL(0.06, 0.9, 0.5 + 0.08 * Math.sin(t * 7.3));
  if (mistGroup) for (const p of mistGroup.children) {
    p.position.x += p.userData.sp * dt;
    if (p.position.x > 46) p.position.x = -46;
  }

  updateCamera(dt);
  renderer.render(scene, camera);

  // one automatic quality drop on very slow devices
  if (!autoDropChecked && S.started) {
    acc += dt; frames++;
    if (acc > 6) {
      if (frames / acc < 24 && S.quality === 'high') { setQuality('low'); toast('已切到省电画质。<br>可以在「⋯ → 画质」里改回来。', 3600); }
      autoDropChecked = true;
    }
  }
}

/* ---------- a small handle for debugging on a real device ---------- */
window.__lastship = { S, INTER, OBJ, AREAS, GEO, walker, CLUES, CLUE_ORDER, screenOf, approach, stage, version: '1.0' };

/* ---------- boot ---------- */
buildSea();
buildFlora();
buildMist();
applyAreaVisuals();
placeWalker(GEO.spawn.x, GEO.spawn.z, Math.PI);
resize();
camSnap = true;
updateCamera(0);
refreshHUD();
setSound(true);
requestAnimationFrame(frame);
</script>
<!-- GAME-END -->
