<!doctype html>
<meta charset="utf-8">
<title>all four hooves</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(92vw,720px);height:auto;background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1080" height="1080"></canvas>
<script src="../assets/core.js"></script>
<script src="../assets/roto.js"></script>
<script src="gallop-clips.js"></script>
<script>
'use strict';
// ============================================================
// ALL FOUR HOOVES. Method: found motion. The horse, the elephant, the kangaroo and the pigeons move the way
// real animals moved in front of Eadweard Muybridge's cameras. The poses come from the drawings he had made
// for his zoopraxiscope discs (Descriptive Zoopraxography, 1893, public domain); roto.py traced every pen stroke
// of them into vectors and the film redraws those strokes with a brush, one pose per frame.
// Square only. 12 fps on twos.
// t      dur  scene      what happens
// 0.0    3.5  question   the horse gallops in place, too fast to read; the question is written
// 3.5    2.5  guess      what painters drew: legs stretched out, floating
// 6.0    6.5  cameras    1878: 12 cameras, 12 threads, the horse trips them one by one, 12 cards
// 12.5   4.5  answer     the airborne frame, drawn on stroke by stroke: tucked under, not stretched out
// 17.0   6.5  disc       1879: the poses on a glass disc; it spins up until the horse runs again
// 23.5   7.0  parade     everything began to move: elephant, kangaroo, pigeons
// 30.5   4.0  end        sign-off and the author's label
// ============================================================
const HANDLE = '@superalesha';
const BASE = makePalette({ paper: '#efe3c8', ink: '#2b2018', light: '#fffaf0', shade: '#7a6a58', blush: '#d98b7a', fills: ['#b98457', '#9db0bd', '#e0a05a', '#a9b98a', '#d9b26a', '#c8a6a0'], accents: ['#c8473f', '#2f6db0', '#e0a526', '#4c9a6a'] }, 'doodlePastel');
const SEPIA = '#b98457', N = 12, AIR = rotoAirborne('horse'), STRETCH = 5;
const tf = (x, y, s, rot = 0) => (px, py) => { const X = px * s, Y = py * s, ca = Math.cos(rot), sa = Math.sin(rot); return [x + X * ca - Y * sa, y + X * sa + Y * ca]; };
const M = (T, pts) => pts.map(p => T(p[0], p[1]));
const dot = (d, x, y, r, col) => d.mark((c, k) => { c.fillStyle = col || PAL.ink; c.beginPath(); c.arc(x, y, r * k, 0, TAU); c.fill(); }, .05);
const groundLine = (d, y, x0 = -400, x1 = W + 400) => d.line([[x0, y + 3], [lerp(x0, x1, .3), y - 2], [lerp(x0, x1, .65), y + 4], [x1, y]], { w: 3.6 });
function tufts(d, y, off, n = 9, span = 1500) { for (let k = 0; k < n; k++) { const x = ((k * 173 - off) % span + span) % span - 200; d.lines([[[x, y], [x - 7, y - 22]], [[x + 10, y], [x + 12, y - 30]], [[x + 20, y], [x + 29, y - 19]]], { w: 2.6, dur: .03 }); } }
function camera(d, x, y, s = 1) { const T = tf(x, y, s), body = M(T, [[-22, -34], [22, -34], [22, 0], [-22, 0]]); d.fill(polyPath(body), PAL.light).line(body, { close: true, w: 2.8, smooth: false }).line(ellPts(...T(0, -17), 9 * s, 9 * s, 0, 8), { close: true, w: 2.4 });
  d.lines([[T(-14, 0), T(-26, 46)], [T(0, 0), T(0, 48)], [T(14, 0), T(26, 46)]], { w: 2.6, dur: .04 }); return d; }
function burst(c, x, y, r, col, seed) { const rr = rng(seed); c.save(); c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'round'; for (let k = 0; k < 9; k++) { const a = k / 9 * TAU + rr() * .3; c.beginPath(); c.moveTo(x + Math.cos(a) * r * .45, y + Math.sin(a) * r * .45); c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); c.stroke(); } c.fillStyle = '#fff8dc'; c.beginPath(); c.arc(x, y, r * .36, 0, TAU); c.fill(); c.restore(); }
// a pose on a little card
function card(c, k, x, y, o = {}) { const { s = 1, rot = 0, hot = false, w = 80, h = 68 } = o; c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.fillStyle = 'rgba(40,25,10,.16)'; c.fillRect(-w / 2 + 3, -h / 2 + 4, w, h); c.fillStyle = '#fffaf0'; c.fillRect(-w / 2, -h / 2, w, h);
  c.strokeStyle = hot ? PAL.accents[0] : PAL.ink; c.lineWidth = hot ? 4 : 2; c.strokeRect(-w / 2, -h / 2, w, h); drawSprite(c, rotoSprite('horse', k, 50, { ink: BASE.ink, fill: null, weight: 1.5 }), 0, h / 2 - 8); c.restore(); }
const threadX = k => 96 + k * 80.6;

function sQuestion(c, tau, i) { usePalette(BASE); setView({ zoom: 1.02 + .05 * tau / 3.5, y: CY + 10 }); backdrop(c); const GY = 800;
  pen(c, tau, i, .1, 1, d => { groundLine(d, GY); tufts(d, GY, tau * 900, 9); }, { speed: 4000, still: true });
  roto(c, 'horse', i, { x: CX, y: GY, h: 470, wash: SEPIA, seed: 5 + boil(i, 2) }); speedLines(c, CX - 300, GY - 250, 0, 5 + i, 8, .6, PAL.ink);
  pen(c, tau, i, .3, 21, d => d.text('when a horse gallops,', 70, 140, { size: 74 })); pen(c, tau, i, 1.4, 22, d => d.text('do all four hooves', 70, 232, { size: 74 })); pen(c, tau, i, 2.2, 23, d => d.text('ever leave the ground?', 70, 324, { size: 74 })); }

function sGuess(c, tau, i) { usePalette(BASE); setView({ zoom: 1.03 }); backdrop(c); const GY = 800, lift = 70 + Math.sin(tau * 3) * 8;
  pen(c, tau, i, 0, 1, d => groundLine(d, GY), { speed: 4000, still: true });
  roto(c, 'horse', STRETCH, { x: CX + 20, y: GY - lift, h: 470, wash: SEPIA, p: sm(.1, 1.2, tau, t => t), seed: 9 + boil(i) });
  pen(c, tau, i, 1.3, 31, d => { d.line([[CX + 30, GY - 8], [CX + 30, GY - lift + 4]], { w: 3.6, color: PAL.accents[0] }).lines([[[CX + 16, GY - 24], [CX + 30, GY - 8], [CX + 44, GY - 24]], [[CX + 16, GY - lift + 20], [CX + 30, GY - lift + 4], [CX + 44, GY - lift + 20]]], { w: 3.6, color: PAL.accents[0], dur: .05 }); d.text('?', CX + 70, GY - 6, { size: 130, ink: PAL.accents[0] }); });
  pen(c, tau, i, .2, 21, d => d.text('for centuries painters guessed:', 70, 140, { size: 66 })); pen(c, tau, i, 1.2, 22, d => d.text('stretched out, like a rocking horse.', 70, 226, { size: 60 })); }

function sCameras(c, tau, i) { usePalette(BASE); const GY = 700, t0 = 1.7, pc = (tau - t0) * 6, pose = Math.floor(pc), hx = threadX(0) + (pc - 1) * 80.6 - 150, gone = pc > 15; setView({ zoom: 1.0 + .03 * sm(0, 6.5, tau, t => t) }); backdrop(c);
  pen(c, tau, i, .1, 1, d => groundLine(d, GY), { speed: 5000, still: true });
  for (let k = 0; k < N; k++) { const tripped = pc >= k + 1, x = threadX(k), a = sm(.5 + k * .05, .7 + k * .05, tau); if (a <= 0) continue; c.save(); c.strokeStyle = PAL.shade; c.lineWidth = 2; c.setLineDash([9, 8]); c.globalAlpha = a; c.beginPath();
    if (!tripped) { c.moveTo(x, GY - 300); c.lineTo(x, GY + 40); } else { c.moveTo(x, GY - 300); c.quadraticCurveTo(x + 26, GY - 210, x + 8, GY - 150); c.moveTo(x, GY + 40); c.quadraticCurveTo(x + 22, GY - 10, x + 30, GY - 30); } c.stroke(); c.restore(); }
  pen(c, tau, i, .45, 3, d => { for (let k = 0; k < N; k++) camera(d, threadX(k), GY + 96, .9); }, { speed: 5200, gap: .004, still: true });
  if (tau > t0 - .4 && !gone) { roto(c, 'horse', pose - 1, { x: hx - 40, y: GY, h: 260, fill: null, al: .16, seed: 4 }); roto(c, 'horse', pose, { x: hx, y: GY, h: 260, wash: SEPIA, seed: 5 + boil(i, 2) }); }
  for (let k = 0; k < N; k++) { const tk = t0 + (k + 1) / 6; if (tau < tk) continue; const a = easeOut(sm(tk, tk + .14, tau, t => t)); if (tau < tk + .17) burst(c, threadX(k), GY + 76, 40, PAL.accents[2], k);
    card(c, k, threadX(k), 330 - (1 - a) * 40, { s: .4 + .6 * a, rot: (rng(k + 2)() - .5) * .12 }); }
  pen(c, tau, i, .2, 21, d => d.text('1878. palo alto.', 70, 130, { size: 72 })); pen(c, tau, i, .9, 22, d => d.text('12 cameras. 12 threads across the track.', 70, 212, { size: 54 }));
  if (tau > 4.6) pen(c, tau, i, 4.6, 23, d => d.text('one stride. 12 photographs.', 70, 985, { size: 64 })); }

function sAnswer(c, tau, i) { usePalette(BASE); setView({ zoom: 1 + .06 * sm(.4, 4.5, tau, t => t), y: CY + 30 * sm(.4, 4.5, tau) }); backdrop(c); const GY = 850, gap = rotoGap('horse', AIR) * 470 / CLIPS.horse.h;
  for (let k = 0; k < N; k++) card(c, k, threadX(k), 120, { rot: (rng(k + 2)() - .5) * .12, hot: k === AIR && tau > .3 });
  const HX0 = CX - 90; if (tau > .3) pen(c, tau, i, .3, 5, d => d.line([[threadX(AIR), 160], [threadX(AIR) - 120, 250], [HX0 + 120, 330]], { w: 3, color: PAL.accents[0] }), { still: true });
  pen(c, tau, i, .2, 1, d => groundLine(d, GY), { speed: 4000, still: true });
  const HX = CX - 90; roto(c, 'horse', AIR, { x: HX, y: GY, h: 470, wash: SEPIA, p: sm(.4, 1.9, tau, t => t), seed: 11 + boil(i) });
  if (tau > 1.9) pen(c, tau, i, 1.9, 7, d => { d.line(ellPts(HX - 10, GY - gap - 52, 190, 82, -.04, 18), { close: true, w: 4.4, color: PAL.accents[0] }); const ax = HX + 215; d.line([[ax, GY - 5], [ax, GY - gap + 3]], { w: 4.4, color: PAL.accents[0] }).lines([[[ax - 14, GY - 20], [ax, GY - 5], [ax + 14, GY - 20]], [[ax - 14, GY - gap + 18], [ax, GY - gap + 3], [ax + 14, GY - gap + 18]], [[ax - 40, GY - gap], [ax + 40, GY - gap]]], { w: 4, color: PAL.accents[0], dur: .05 }); }, { still: true });
  pen(c, tau, i, 1.6, 21, d => d.text('photograph ' + (AIR + 1) + ':', 70, 300, { size: 60 })); pen(c, tau, i, 2.1, 22, d => d.text('all four. in the air.', 70, 955, { size: 84, ink: PAL.accents[0] })); if (tau > 3.3) pen(c, tau, i, 3.3, 24, d => d.text('tucked under, not stretched out.', 70, 1025, { size: 46 }));
  if (tau > 3.0) { drawSprite(c, rotoSprite('horse', STRETCH, 150, { ink: BASE.ink, wash: SEPIA }), 905, 640, { al: sm(3.0, 3.2, tau) }); pen(c, tau, i, 3.2, 9, d => d.lines([[[800, 495], [1010, 650]], [[1010, 495], [800, 650]]], { w: 5, color: PAL.accents[0] }), { still: true }); } }

// the disc: 12 poses stand on the rim, heads to the hub. It spins up to exactly one pose per drawn frame, and then the horse runs again.
function discAngle(n) { let th = 0; for (let q = 1; q <= n; q++) th += Math.min(1, Math.pow(q / 30, 2)) * TAU / N; return th; }
function sDisc(c, tau, i) { const NIGHT = chalkPalette(BASE); usePalette(NIGHT); const f = Math.round(tau * 12), n = Math.max(0, f - 16), locked = n >= 30, th = discAngle(n), zoom = 1 + 1.5 * sm(5.3, 6.5, tau, easeIn), cx = CX, cy = 520, R = 360;
  setView({ zoom, x: lerp(CX, cx, sm(5.3, 6.5, tau)), y: lerp(CY, cy + R - 80, sm(5.3, 6.5, tau)) }); backdrop(c, '#23243f', { vignette: .4, spot: .12 });
  if (locked) glow(c, cx, cy + R - 80, 210, '#ffe2a0', .5 * sm(3.9, 4.3, tau));
  pen(c, tau, i, .1, 3, d => { d.line(ellPts(cx, cy, R + 14, R + 14, 0, 40), { close: true, w: 4 }).line(ellPts(cx, cy, 64, 64, 0, 14), { close: true, w: 2.6 }).line(ellPts(cx, cy, 26, 26, 0, 10), { close: true, w: 4 }); }, { speed: 5000, still: true });
  const steps = locked ? n - 30 : 0;
  for (let j = 0; j < N; j++) { const a0 = sm(.3 + j * .07, .5 + j * .07, tau); if (a0 <= 0) continue; const a = -j * TAU / N + th - (locked ? steps * TAU / N : 0), x = cx + Math.sin(a) * R, y = cy + Math.cos(a) * R;   // when locked the disc has turned a whole number of poses: it looks still
    const pose = locked ? j + steps : j; drawSprite(c, rotoSprite('horse', pose, 150, { ink: NIGHT.ink, fill: NIGHT.light, weight: 1.3 }), x, y, { rot: -a, al: a0 }); }
  if (n > 6) { c.save(); c.strokeStyle = alpha(NIGHT.ink, locked ? .16 : .25); c.lineWidth = 2; c.lineCap = 'round'; for (let q = 0; q < 16; q++) { const a = q / 16 * TAU + th * 1.7 + (locked ? f * 1.3 : 0), r0 = (q % 2 ? R + 30 + (q % 3) * 9 : 60 + (q % 4) * 22); c.beginPath(); c.arc(cx, cy, r0, a, a + .3 * Math.min(1, n / 20)); c.stroke(); } c.restore(); }
  pen(c, tau, i, 3.4, 9, d => d.line([[cx - 120, cy + R + 26], [cx - 120, cy + R - 190], [cx + 120, cy + R - 190], [cx + 120, cy + R + 26]], { close: true, w: 3.4, smooth: false, color: '#ffe2a0' }), { still: true });
  pen(c, tau, i, .2, 21, d => d.text('1879. he paints the 12 poses', 60, 70, { size: 50 })); pen(c, tau, i, 1.2, 22, d => d.text('on a glass disc. and spins it.', 60, 1040, { size: 50 }));
  if (tau > 3.9 && tau < 5.6) pen(c, tau, i, 3.9, 23, d => d.text('the horse runs again.', cx, cy - 105, { size: 48, align: 'center' })); }

function sParade(c, tau, i) { usePalette(BASE); setView({ zoom: 1.04, x: CX + 20 * Math.sin(tau * .7) }); backdrop(c); const GY = 800, off = tau * 620;
  pen(c, tau, i, -9, 2, d => { for (let k = 0; k < 4; k++) { const x = ((k * 520 - off * .25) % 2080 + 2080) % 2080 - 500; d.line([[x, GY - 60], [x + 170, GY - 190], [x + 330, GY - 110], [x + 470, GY - 170], [x + 640, GY - 60]], { w: 2.6, color: PAL.shade }); } }, { still: true });
  pen(c, tau, i, -9, 1, d => { groundLine(d, GY); tufts(d, GY, off, 10, 1600); }, { still: true });
  const ex = 1500 - (tau - .6) * 300, kx = 1500 - (tau - 1.6) * 120, px = 250 + tau * 38, FAR = GY - 150, kp = ((i % 12) + 12) % 12, hopY = -70 * Math.max(0, Math.sin((kp - 3.5) / 7 * Math.PI));
  pen(c, tau, i, -9, 4, d => d.line([[-400, FAR + 2], [300, FAR - 3], [800, FAR + 3], [W + 400, FAR]], { w: 2.4, color: PAL.shade }), { still: true });
  roto(c, 'pigeons', i, { x: px, y: 300 + Math.sin(tau * 2) * 14, h: 170, wash: PAL.fills[1], seed: 31 }); roto(c, 'pigeons', i + 5, { x: px + 520, y: 250 + Math.cos(tau * 2.3) * 12, h: 120, wash: PAL.fills[1], seed: 33 });
  roto(c, 'elephant', Math.floor(i / 2), { x: ex, y: FAR, h: 380, wash: PAL.fills[1], washAl: .45, seed: 41 + boil(i, 2) });
  roto(c, 'kangaroo', i, { x: kx, y: GY + hopY, h: 300, wash: PAL.fills[2], seed: 51 });
  roto(c, 'horse', i, { x: 330, y: GY, h: 380, wash: SEPIA, seed: 5 }); speedLines(c, 100, GY - 200, 0, 5 + i, 7, .55, PAL.ink);
  pen(c, tau, i, .3, 21, d => d.text('then everything began to move.', 60, 120, { size: 68 }));
  if (tau > 4.2) pen(c, tau, i, 4.2, 22, d => d.text('real motion, from his 1893 drawings. every stroke redrawn by code.', 60, 1000, { size: 40 })); }

function authorLabel(c, tau, i, t0, x, y) { const drop = easeOut(sm(t0, t0 + .3, tau, t => t)), T = (px, py) => tf(x, y - (1 - drop) * 26, 1, -.045 + (1 - drop) * .05)(px, py), crd = M(T, [[-222, -66], [222, -66], [222, 66], [-222, 66]]), X = (u, v) => T(-162 + u * 68, v * 68);
  if (tau > t0) { c.save(); c.globalAlpha = .16 * drop; c.fillStyle = '#2a2010'; c.fill(polyPath(M(T, [[-215, -57], [229, -57], [229, 75], [-215, 75]]))); c.restore(); }
  pen(c, tau, i, t0, 61, d => { d.fill(polyPath(crd), '#fffdf7', { al: 1 }).line(crd, { close: true, w: 3.2, smooth: false, speed: 2600 }); dot(d, ...T(0, -50), 5.5, PAL.accents[0]);
    d.line([X(-.5, -.5), X(-.2, -.5), X(.5, .5), X(.2, .5)], { close: true, w: 3.6, smooth: false, speed: 900 }).line([X(.46, -.5), X(.07, -.06)], { w: 3.6 }).line([X(-.07, .06), X(-.46, .5)], { w: 3.6 });
    d.mark((c, k) => { c.save(); c.translate(...T(-108, 19)); c.rotate(-.045); handText(c, HANDLE.slice(0, Math.ceil(HANDLE.length * k)), 0, 0, { size: 53, ink: PAL.ink, ink2: null }); c.restore(); }, .55); }, { still: true }); }

function sEnd(c, tau, i) { usePalette(BASE); setView({ zoom: 1.02 }); backdrop(c); const GY = 850;
  pen(c, tau, i, -9, 1, d => { groundLine(d, GY); tufts(d, GY, tau * 500, 8, 1500); }, { still: true });
  roto(c, 'horse', i, { x: 790, y: GY, h: 300, wash: SEPIA, seed: 5 }); roto(c, 'pigeons', i + 3, { x: 560, y: 250, h: 120, wash: PAL.fills[1], seed: 31 });
  signOff(c, 'found motion', 'after muybridge, 1878', { x: 400, y: 330, size: 88, progressA: sm(.3, 1.0, tau, t => t), progressB: sm(1.1, 2.0, tau, t => t) });
  authorLabel(c, tau, i, 2.0, 300, 640); }

// ===================== SCORE =====================
function score(ac, t0, dest) { const master = ac.createGain(); master.gain.value = .5; master.connect(dest); const hz = (o, s) => pentHz(o, s, 196), box = (t, f, g = .18, d = .9) => { note(ac, master, f, t0, t, d, 'sine', g); note(ac, master, f * 2, t0, t, d * .5, 'triangle', g * .2); };
  const hoof = (t, g = .2) => { noiseBurst(ac, master, t0, t, .05, g, 3); note(ac, master, 70, t0, t, .09, 'sine', g * 1.4); }, stride = (t, g) => { hoof(t, g); hoof(t + .11, g * .8); hoof(t + .24, g); };
  for (let t = 0; t < 3.4; t += 1) stride(t + .05, .22); [[.3, 1, 0], [1.4, 1, 2], [2.2, 1, 4], [2.9, 2, 0]].forEach(([t, o, s]) => box(t, hz(o, s)));
  [[3.6, 1, 3], [4.7, 1, 1], [5.4, 0, 4]].forEach(([t, o, s]) => box(t, hz(o, s), .17, 1.4));
  [[6.2, 1, 0], [6.9, 1, 2]].forEach(([t, o, s]) => box(t, hz(o, s))); for (let k = 0; k < 12; k++) { const t = 6 + 1.7 + (k + 1) / 6; noiseBurst(ac, master, t0, t, .03, .3, k + 2); box(t, hz(1 + Math.floor(k / 5), k % 5), .15, .5); } for (let t = 7.6; t < 10.4; t += 1) stride(t, .16); box(10.7, hz(1, 0), .2, 2);
  [[12.5, 0, 0], [12.5, 1, 2]].forEach(([t, o, s]) => box(t, hz(o, s), .16, 2.5)); [[14.6, 1, 0], [14.6, 1, 2], [14.6, 2, 0], [14.6, 1, 4]].forEach(([t, o, s]) => box(t, hz(o, s), .2, 2.6));
  for (let n = 1; n <= 62; n++) { const t = 17 + (16 + n) / 12, g = Math.min(.22, .04 + n * .006); if (t < 23.4) noiseBurst(ac, master, t0, t, .02, g, n % 5 + 1); } [[17.2, 0, 0], [18.2, 0, 2], [19.2, 0, 4]].forEach(([t, o, s]) => box(t, hz(o, s), .16, 1.4));
  for (let k = 0; k < 16; k++) box(20.9 + k * .125, hz(1 + Math.floor((k % 10) / 5), k % 5), .12, .5);
  for (let t = 23.5; t < 30.4; t += .5) { stride(t, .15); note(ac, master, hz(-1, [0, 0, 3, 4][Math.round((t - 23.5) * 2) % 4]), t0, t, .4, 'sawtooth', .06); } [0, 2, 4, 2, 3, 4, 2, 0, 1, 2, 4, 3, 2, 0].forEach((s, k) => box(23.5 + k * .5, hz(1 + (k > 8 ? 1 : 0), s), .16, .7));
  [[30.5, 0, 0], [30.5, 1, 0], [30.5, 1, 2], [30.5, 1, 4], [32.0, 2, 0], [32.5, 2, 2], [33.0, 2, 4]].forEach(([t, o, s]) => box(t, hz(o, s), .17, 2.4)); for (let t = 30.6; t < 33; t += 1) stride(t, .1); }

const TIMELINE = [{ name: 'question', dur: 3.5, fn: sQuestion }, { name: 'guess', dur: 2.5, fn: sGuess }, { name: 'cameras', dur: 6.5, fn: sCameras }, { name: 'answer', dur: 4.5, fn: sAnswer },
  { name: 'disc', dur: 6.5, fn: sDisc }, { name: 'parade', dur: 7.0, fn: sParade }, { name: 'end', dur: 4.0, fn: sEnd }];
defineFilm({ timeline: TIMELINE, score, format: { ar: '1:1' } });
</script>
